const SCAN_BATCH = 200;

function buildScanRecord(it, d) {
  const bars = d.bars || [];
  const rec = Object.assign({ code: it.code, name: it.name }, scoreStock(bars, d.rps));
  try {
    const adv = expertAdvice(bars);
    if (adv.ok) { rec.ev = adv.verdict; rec.ox = adv.overext; rec.regime = adv.regime; }
  } catch (e) { /* 判别失败不影响打分 */ }
  try { rec.coil = coilScore(bars); } catch (e) { /* 不影响打分 */ }
  try {
    const maSigs = computeMaSignals(bars, maSeries(bars, 5), maSeries(bars, 20));
    if (maSigs.length) {
      const lastX = maSigs[maSigs.length - 1];
      rec.xLabel = lastX.type === 'buy' ? '金叉' : '死叉';
      rec.xDays = bars.length - 1 - lastX.index;
    }
  } catch (e) { /* 不影响打分 */ }
  return rec;
}

async function scanGroupStocks(group, items, onProgress) {
  const klineUrl = '/api/kline/batch';
  items = (items || []).filter(it => !(it.code && it.code.startsWith('920')));
  const results = new Array(items.length);
  let done = 0, idx = 0;
  const POOL = Math.min(8, items.length || 1);

  let pending = [];
  let firstBatch = true;
  let scannedAt = null;
  let postChain = Promise.resolve();
  function flush(force) {
    if (!force && pending.length < SCAN_BATCH) return;
    if (pending.length === 0 && !force) return;
    const batch = pending; pending = [];
    const reset = firstBatch; firstBatch = false;
    postChain = postChain.then(() => postScanBatch(group, batch, reset)
        .then(at => { if (at) scannedAt = at; }));
  }

  const KLINE_BATCH = 50;
  async function worker() {
    while (true) {
      const from = idx; idx += KLINE_BATCH;
      if (from >= items.length) break;
      const slice = items.slice(from, Math.min(from + KLINE_BATCH, items.length));
      let data = {}, batchFailed = false;
      try {
        const r = await fetch(klineUrl, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ codes: slice.map(x => x.code), days: 130 })
        });
        data = (await r.json()).data || {};
      } catch (e) { batchFailed = true; }

      for (let k = 0; k < slice.length; k++) {
        const my = from + k;
        const it = slice[k];
        let rec;
        try {
          if (batchFailed) throw new Error('batch fetch failed');
          rec = buildScanRecord(it, data[it.code] || {});
        } catch (e) {
          rec = { code: it.code, name: it.name, level: '失败', tier: 0, score: -1,
            reasons: [{ kind: 'warn', text: 'K 线获取失败' }] };
        }
        results[my] = rec;
        pending.push(rec);
        flush(false);
        done++; if (onProgress) onProgress(done, items.length);
      }
    }
  }
  await Promise.all(Array.from({ length: POOL }, worker));
  flush(true);
  try { await postChain; } catch (e) { /* 存储失败不影响展示 */ }
  return { results: results.filter(Boolean), scannedAt };
}

async function postScanBatch(group, items, reset) {
  try {
    const r = await fetch('/api/watch/scan-result/batch' + '?name=' + encodeURIComponent(group)
        + '&reset=' + (reset ? 'true' : 'false'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items })
    });
    return (await r.json()).scannedAt;
  } catch (e) { return null; }
}

// 指标扫描弹窗里的「扫描并存储」
async function runScanAndStore() {
  document.getElementById('scanProgress').textContent = '正在获取分组完整清单…';
  let allItems = [];
  try { allItems = await fetchWholeGroup(scanGroup); } catch (e) {}
  if (!allItems.length) { document.getElementById('scanProgress').textContent = '分组为空或清单获取失败'; return; }
  const { results, scannedAt } = await scanGroupStocks(scanGroup, allItems, (done, total) => {
    document.getElementById('scanProgress').textContent =
        `扫描中… ${done}/${total}（拉取日 K 并按背驰法 + 均线 + 量能 + 位置综合评分）`;
  });
  renderScanResults(results, { cached: false, scannedAt });
}

function forceRescan() {
  if (scanGroup) runScanAndStore();
}

function fmtScanTime(s) {
  if (!s) return '';
  const d = s.replace('T', ' ');
  return d.length >= 16 ? d.slice(5, 16) : d;
}

function renderScanResults(results, meta) {
  meta = meta || {};
  results.sort((a, b) => b.score - a.score);
  const strong = results.filter(r => r.tier === 5).length;
  const build = results.filter(r => r.tier === 4).length;
  const when = fmtScanTime(meta.scannedAt);
  const freshTag = meta.cached
      ? `<span style="color:#6b7280">· 休盘期间，显示 ${when || '上次'} 的结果</span>`
      : `<span style="color:#6b7280">· 扫描于 ${when || '刚刚'}</span>`;
  const totalNote = meta.total && meta.total > results.length
      ? `共 ${meta.total} 只（弹窗显示前 ${results.length}，完整看「扫描结果」Tab）` : `共 ${results.length} 只`;
  document.getElementById('scanProgress').innerHTML =
      `${totalNote} · <span style="color:#b91c1c;font-weight:600">A档 ${strong}</span> · ` +
      `<span style="color:#15803d;font-weight:600">B档 ${build}</span> ${freshTag}` +
      `<button class="btn-default" style="margin-left:10px;padding:3px 10px;font-size:12px;" onclick="forceRescan()">重新扫描</button>`;

  scanModalAll = results;
  scanModalShown = 0;
  const list = document.getElementById('scanList');
  list.innerHTML = '';
  const body = document.getElementById('scanModalBody');
  if (body) body.scrollTop = 0;
  appendScanModalChunk();   // 首屏
  bindScanModalScroll();
  fillScanModalViewport();
}

let scanModalAll = [];
let scanModalShown = 0;
let scanModalScrollBound = false;

function appendScanModalChunk() {
  const list = document.getElementById('scanList');
  if (!list) return;
  const end = Math.min(scanModalShown + WATCH_CHUNK, scanModalAll.length);
  let html = '';
  for (let i = scanModalShown; i < end; i++) html += scanRowHtml(scanModalAll[i], i);
  const old = document.getElementById('scanModal-foot');
  if (old) old.remove();
  list.insertAdjacentHTML('beforeend', html);
  scanModalShown = end;
  if (scanModalShown >= scanModalAll.length) {
    list.insertAdjacentHTML('beforeend',
      '<div id="scanModal-foot" class="scan-disclaimer">仅辅助参考，不构成投资建议。</div>');
  }
}

function bindScanModalScroll() {
  if (scanModalScrollBound) return;
  const body = document.getElementById('scanModalBody');
  if (!body) return;
  body.addEventListener('scroll', () => {
    if (scanModalShown >= scanModalAll.length) return;
    if (body.scrollTop + body.clientHeight >= body.scrollHeight - 80) appendScanModalChunk();
  });
  scanModalScrollBound = true;
}

function fillScanModalViewport() {
  const body = document.getElementById('scanModalBody');
  if (!body) return;
  let g = 0;
  while (scanModalShown < scanModalAll.length
         && body.scrollHeight <= body.clientHeight + 4
         && g++ < 100) {
    appendScanModalChunk();
  }
}

function scanMark(k) {
  return k === 'good' ? '✓' : k === 'bad' ? '✗' : k === 'warn' ? '!' : '·';

  }

  }
  const rgMap = { UPTREND: ['↗上升趋势', '#166534', '#dcfce7', '均线发散向上的平滑上涨'],
                  RANGE_UP: ['↗震荡上升', '#166534', '#ecfdf5', '台阶式上涨：低点持续抬高，但均线缠绕'],
                  DOWNTREND: ['↘下降趋势', '#6b7280', '#f3f4f6', '空头排列且跌破MA60'] };
  if (r.regime && rgMap[r.regime]) {
    const [t, c, bg, tip] = rgMap[r.regime];
    evBadge += `<span title="${tip}" style="font-size:11px;padding:1px 8px;border-radius:9px;background:${bg};color:${c};font-weight:600;">${t}</span>`;
  }
  if (r.bCount >= 2) {
    evBadge += `<span title="近15根K线内${r.bCount}个背驰买点" style="font-size:11px;padding:1px 8px;border-radius:9px;background:#dbeafe;color:#1d4ed8;font-weight:600;">连买×${r.bCount}</span>`;
  }
  if (typeof r.coil === 'number' && r.coil >= 70) {
    evBadge += `<span title="蓄势分 ${r.coil}/100" style="font-size:11px;padding:1px 8px;border-radius:9px;background:#ccfbf1;color:#0f766e;font-weight:600;">蓄势${r.coil}</span>`;
  }
  if (typeof r.vRatio === 'number') {
    let vt = '', vbg = '', vfg = '';
    if (r.vRatio >= 2.0) { vt = '爆量'; vbg = '#fee2e2'; vfg = '#b91c1c'; }
    else if (r.vRatio >= 1.5) { vt = '放量'; vbg = '#ffedd5'; vfg = '#c2410c'; }
    else if (r.vRatio <= 0.5) { vt = '地量'; vbg = '#ede9fe'; vfg = '#7c3aed'; }
    else if (r.vRatio <= 0.7) { vt = '缩量'; vbg = '#dbeafe'; vfg = '#2563eb'; }
    if (vt) evBadge += `<span title="今日量比 ${r.vRatio}倍（今日量/前5日均量）" style="font-size:11px;padding:1px 8px;border-radius:9px;background:${vbg};color:${vfg};font-weight:600;">${vt}${r.vRatio}×</span>`;
  }
  if (typeof r.susp === 'number' && r.susp >= 60) {
    evBadge += `<span title="放量滞涨强度 ${r.susp}/100" style="font-size:11px;padding:1px 8px;border-radius:9px;background:#fef9c3;color:#a16207;font-weight:600;">滞涨${r.susp}</span>`;
  }
  const nm = (r.name || '').replace(/'/g, '');
  return `<div class="scan-row" onclick="scanOpenKline('${r.code}','${nm}')">
    <div class="head">
      <span class="rank">${i + 1}</span>
      <span class="nm">${r.name || ''}</span>
      <span class="cd">${r.code}</span>
      ${evBadge}
      <span class="sp"></span>
      <button class="btn-default" style="padding:2px 10px;font-size:12px;color:#2563eb;border-color:#bfdbfe;"
        onclick="event.stopPropagation();analyzeStock('${r.code}','${nm}')">分析</button>
      <button class="btn-default" style="padding:2px 10px;font-size:12px;color:#059669;border-color:#a7f3d0;"
        onclick="event.stopPropagation();scanLatest('${r.code}','${nm}')" title="强制拉最新实时数据，看当前价">最新</button>
      <span class="lvl lvl-s${r.tier}">${r.level}</span>
      <span class="scan-score">${scoreTxt}</span>
    </div>
    <div class="scan-reasons">${reasons}</div>
  </div>`;
}

let currentScanResGroup = null;

// ===== 扫描结果 Tab =====
let scanResItems = [];
let scanResTotal = 0;
let scanResLoading = false;
let scanResSeq = 0;
let scanResSeen = new Set();  // 已上屏代码：重扫期间排序漂移也绝不重复显示
let scanResFetched = 0;
let scanResScrollBound = false;
let scanResBLabel = '';        // B点级别 B1/B2/B3
let scanResBDays = null;       // B点距今天数上限
let scanResXLabel = '';        // 最近一次均线交叉 金叉/死叉
let scanResXDays = null;       // 交叉距今天数上限
let scanResBCount = null;      // 连续买点：近15根买点数下限
let scanResRegime = '';
let scanFlagMap = {};
let scanOsMap = {};
let scanBtMap = {};
let scanResKeyword = '';       // 搜索词
let scanResSearchTimer = null;

// 当前筛选条件（分页查询和导出共用）
function scanResFilterParams() {
  const q = new URLSearchParams();
  q.set('name', currentScanResGroup);
  if (scanResBLabel) q.set('bLabel', scanResBLabel);
  if (scanResBDays != null) q.set('bDays', scanResBDays);
  if (scanResXLabel) q.set('xLabel', scanResXLabel);
  if (scanResXDays != null) q.set('xDays', scanResXDays);
  if (scanResBCount != null) q.set('bCount', scanResBCount);
  if (scanResRegime) q.set('regime', scanResRegime);
  if (scanResKeyword) q.set('kw', scanResKeyword);
  return q;
}

function scanResQuery(offset, limit) {
  const q = scanResFilterParams();
  q.set('offset', offset);
  q.set('limit', limit || 30);
  return '/api/watch/scan-result?' + q.toString();
}

async function exportScanRes() {
  if (!currentScanResGroup) { alert('请先选择分组'); return; }
  const btn = document.getElementById('scanres-export-btn');
  const old = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '导出中…'; }
  try {
    const d = await (await fetch('/api/watch/scan-result/export?' + scanResFilterParams().toString())).json();
    if (!d.ok) { alert('导出失败：' + (d.error || '')); return; }
    const items = d.items || [];
    if (!items.length) { alert('当前筛选下没有结果可导出'); return; }
    const rows = ['名称,代码'].concat(items.map(it =>
      `"${(it.name || '').replace(/"/g, '""')}",="${(it.code || '')}"`));
    const csv = '﻿' + rows.join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = currentScanResGroup + '_筛选结果_' + items.length + '只.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (e) { alert('导出失败：' + e); }
  finally { if (btn) { btn.disabled = false; btn.textContent = old; } }
}

async function loadScanResults() {
  const list = document.getElementById('scanres-list');
  const timeEl = document.getElementById('scanres-time');
  if (!currentScanResGroup) {
    list.innerHTML = '<div class="dim" style="padding:20px;text-align:center">请选择一个分组</div>';
    timeEl.textContent = '';
    return;
  }
  scanResItems = []; scanResTotal = 0; scanResSeen.clear(); scanResFetched = 0;
  const mySeq = ++scanResSeq;   // 作废所有在途请求
  scanResLoading = false;
  list.innerHTML = '<div class="dim" style="padding:16px">读取中…</div>';
  const card = document.getElementById('scanres-card');
  if (card) card.scrollTop = 0;
  await fetchScanResPage(true, mySeq);
  bindScanResScroll();
}

async function fetchScanResPage(first, seq) {
  if (seq == null) seq = scanResSeq;
  if (seq !== scanResSeq || scanResLoading) return;
  scanResLoading = true;
  try {
    const d = await (await fetch(scanResQuery(scanResFetched))).json();
    if (seq !== scanResSeq) { scanResLoading = false; return; }
    scanResFetched += (d.items || []).length;
    scanResTotal = d.total || 0;
    if (first) { scanBtMap = {}; scanOsMap = {}; scanFlagMap = {}; }
    Object.assign(scanBtMap, d.bt || {});
    Object.assign(scanOsMap, d.os || {});
    Object.assign(scanFlagMap, d.flag || {});
    const list = document.getElementById('scanres-list');
    if (first) list.innerHTML = '';
    const startIdx = scanResItems.length;
    (d.items || []).forEach(r => {
      if (r && r.code && !scanResSeen.has(r.code)) { scanResSeen.add(r.code); scanResItems.push(r); }
    });
    if (first && !scanResItems.length) {
      const filtered = scanResKeyword || scanResBLabel || scanResBDays != null || scanResXLabel
        || scanResXDays != null || scanResBCount != null || scanResRegime;
      const tip = filtered ? '当前筛选条件下没有结果'
        : '该分组还没有扫描结果<br>去「自选分组」选中它点「指标扫描」，或点上方「重新扫描」';
      list.innerHTML = '<div class="dim" style="padding:20px;text-align:center;line-height:1.8">' + tip + '</div>';
    } else {
      let html = '';
      for (let i = startIdx; i < scanResItems.length; i++) html += scanRowHtml(scanResItems[i], i);
      const foot = document.getElementById('scanres-foot');
      if (foot) foot.remove();
      list.insertAdjacentHTML('beforeend', html);
      if (scanResFetched >= scanResTotal) {
        list.insertAdjacentHTML('beforeend',
          '<div id="scanres-foot" class="scan-disclaimer">仅辅助参考，不构成投资建议。</div>');
      }
    }
    const timeEl = document.getElementById('scanres-time');
    timeEl.innerHTML = (d.scannedAt ? `扫描于 ${fmtScanTime(d.scannedAt)} · ` : '') +
      `共 ${scanResTotal} 只 · <span style="color:#b91c1c;font-weight:600">A档 ${d.strong || 0}</span> · ` +
      `<span style="color:#15803d;font-weight:600">B档 ${d.build || 0}</span>`;
  } catch (e) { /* 拉取失败保持现状 */ }
  scanResLoading = false;
  fillScanResViewport();
}

function onScanResBpChange() {
  scanResBLabel = document.getElementById('scanres-bpoint-select').value || '';
  const d = parseInt(document.getElementById('scanres-bdays').value, 10);
  scanResBDays = isNaN(d) || d < 0 ? null : d;
  loadScanResults();
}
function onScanResCrossChange() {
  scanResXLabel = document.getElementById('scanres-cross-select').value || '';
  const d = parseInt(document.getElementById('scanres-xdays').value, 10);
  scanResXDays = isNaN(d) || d < 0 ? null : d;
  loadScanResults();
}
function onScanResRegimeChange() {
  scanResRegime = document.getElementById('scanres-regime-select').value || '';
  loadScanResults();
}
function onScanResBcChange() {
  const bc = parseInt(document.getElementById('scanres-bcount').value, 10);
  scanResBCount = isNaN(bc) || bc <= 0 ? null : bc;
  loadScanResults();
}
function onScanResSearch() {
  clearTimeout(scanResSearchTimer);
  scanResSearchTimer = setTimeout(() => {
    scanResKeyword = (document.getElementById('scanres-search').value || '').trim();
    loadScanResults();
  }, 400);   // 防抖：停止输入 400ms 后才查
}

function bindScanResScroll() {
  if (scanResScrollBound) return;
  const card = document.getElementById('scanres-card');
  if (!card) return;
  card.addEventListener('scroll', () => {
    if (currentTab !== 'scanresult' || scanResLoading) return;
    if (scanResFetched >= scanResTotal) return;
    if (card.scrollTop + card.clientHeight >= card.scrollHeight - 120) fetchScanResPage(false, scanResSeq);
  });
  scanResScrollBound = true;
}

function fillScanResViewport() {
  const card = document.getElementById('scanres-card');
  if (!card || !card.style.maxHeight) return;
  if (scanResLoading || scanResFetched >= scanResTotal) return;
  if (card.scrollHeight <= card.clientHeight + 4) fetchScanResPage(false, scanResSeq);
}

function esc(s) { return (s == null ? '' : String(s)).replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

// ===== 复盘日记 =====
const TJ_TAGS = ['纪律执行', '追高', '恐慌割肉', '卖飞太早', '死扛不止损', '接飞刀', '吃到主升', '消息驱动', '打板', '抄底'];
let tjData = null;

async function tjAddBuy() {
  const code = (document.getElementById('tj-code').value || '').trim();
  const bdate = document.getElementById('tj-bdate').value;
  const bprice = parseFloat(document.getElementById('tj-bprice').value);
  const qty = parseInt(document.getElementById('tj-qty').value, 10);
  if (!code) { alert('请填代码'); return; }
  if (!bdate) { alert('请填买入日'); return; }
  if (isNaN(bprice) || bprice <= 0) { alert('请填买入价'); return; }
  if (isNaN(qty) || qty <= 0) { alert('请填股数'); return; }
  const body = { code, name: document.getElementById('tj-name').value || '', buyDate: bdate,
    buyPrice: bprice, qty, reason: document.getElementById('tj-reason').value || '' };
  try {
    const r = await (await fetch('/api/journal/buy', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })).json();
    if (!r.ok) { alert('记录失败：' + (r.error || '')); return; }
    ['tj-code', 'tj-name', 'tj-bprice', 'tj-qty', 'tj-reason'].forEach(id => document.getElementById(id).value = '');
    loadJournal();
  } catch (e) { alert('记录失败：' + e); }
}

async function loadJournal() {
  const body = document.getElementById('journal-body');
  try { tjData = await (await fetch('/api/journal/list')).json(); }
  catch (e) { body.innerHTML = '<div class="dim" style="padding:30px;text-align:center">加载失败</div>'; return; }
  renderJournal();
}

function tjMoney(v) {
  if (v == null) return '<span class="dim">—</span>';
  const x = Number(v);
  const c = x > 0 ? '#dc2626' : x < 0 ? '#16a34a' : '#6b7280';   // 红盈绿亏（A股惯例）
  return `<b style="color:${c}">${x > 0 ? '+' : ''}${x.toFixed(0)}</b>`;
}
function tjPct(v) {
  if (v == null) return '';
  const x = Number(v);
  const c = x > 0 ? '#dc2626' : x < 0 ? '#16a34a' : '#6b7280';
  return `<span style="color:${c};font-size:12px;">(${x > 0 ? '+' : ''}${x.toFixed(1)}%)</span>`;
}

function renderJournal() {
  const d = tjData || {};
  const trades = d.trades || [], st = d.stats || {}, tagStats = d.tagStats || [];
  // 汇总条
  document.getElementById('journal-stats').innerHTML = st.closedCount
    ? `<div style="display:flex;gap:20px;flex-wrap:wrap;background:#f8fafc;border:1px solid #e5e7eb;border-radius:8px;padding:10px 14px;font-size:13px;">
        <span>已平仓 <b>${st.closedCount}</b> 笔</span>
        <span>胜率 <b>${st.winRate != null ? st.winRate + '%' : '—'}</b></span>
        <span>实现盈亏 ${tjMoney(st.realizedPnl)} 元</span>
        <span>平均持有 <b>${st.avgHoldDays != null ? st.avgHoldDays : '—'}</b> 天</span>
      </div>` : '';
  // 标签归因表
  const tsEl = document.getElementById('journal-tagstats');
  if (tagStats.length) {
    let rows = tagStats.map(t =>
      `<tr><td style="text-align:left;font-weight:600;">${esc(t.tag)}</td><td>${t.count}</td>
        <td>${t.winRate != null ? t.winRate + '%' : '—'}</td><td>${tjMoney(t.pnl)}</td></tr>`).join('');
    tsEl.innerHTML = `<div style="font-weight:700;font-size:13px;margin:2px 0 6px;">按标签归因（亏得最多的排最前，一眼看到坑）</div>
      <div style="overflow-x:auto;"><table class="bt-table" style="border-collapse:collapse;font-size:12.5px;min-width:360px;">
        <thead><tr style="background:#f1f5f9;"><th style="text-align:left;">标签</th><th>笔数</th><th>胜率</th><th>累计盈亏</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
  } else tsEl.innerHTML = '';
  // 列表
  const open = trades.filter(t => t.status === 'OPEN'), closed = trades.filter(t => t.status === 'CLOSED');
  let html = '';
  if (open.length) {
    html += `<div style="font-weight:700;font-size:13px;margin:14px 0 6px;">持仓中（${open.length}）</div>`;
    html += open.map(tjOpenRow).join('');
  }
  if (closed.length) {
    html += `<div style="font-weight:700;font-size:13px;margin:16px 0 6px;">已平仓（${closed.length}）</div>`;
    html += closed.map(tjClosedRow).join('');
  }
  if (!open.length && !closed.length) html = '<div class="dim" style="padding:30px;text-align:center">还没有记录。上面填一笔买入开始。</div>';
  document.getElementById('journal-body').innerHTML = html;
}

function tjOpenRow(t) {
  const fp = t.floatPnlAmt != null ? `浮动 ${tjMoney(t.floatPnlAmt)} ${tjPct(t.floatPnlPct)}<span class="dim" style="font-size:11px;"> @最新${t.lastClose}</span>` : '<span class="dim">最新价缺</span>';
  return `<div style="border:1px solid #e5e7eb;border-radius:8px;padding:8px 12px;margin-bottom:6px;">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <b>${esc(t.name) || ''}</b><span class="dim">${esc(t.code)}</span>
      <span style="font-size:12.5px;">买入 ${t.buyDate} @${t.buyPrice} ×${t.qty}</span>
      <span style="font-size:12.5px;">${fp}</span>
      <span class="sp" style="flex:1;"></span>
      <button class="btn-default" style="padding:3px 10px;font-size:12px;color:#c2410c;border-color:#fed7aa;" onclick="tjToggleClose(${t.id})">平仓</button>
      <button class="btn-default" style="padding:3px 10px;font-size:12px;color:#b91c1c;border-color:#fecaca;" onclick="tjDelete(${t.id})">删除</button>
    </div>

    <div id="tj-close-${t.id}" style="display:none;margin-top:8px;padding-top:8px;border-top:1px dashed #e5e7eb;display:none;">
      <span style="font-size:12px;">卖出日</span> <input id="tj-sd-${t.id}" type="date" style="padding:5px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;">
      <span style="font-size:12px;">卖出价</span> <input id="tj-sp-${t.id}" type="number" step="0.001" placeholder="价" style="width:80px;padding:5px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;">
      <input id="tj-sr-${t.id}" placeholder="卖出理由(选填)" style="width:180px;padding:5px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;">
      <button class="btn-success" style="padding:4px 10px;font-size:12px;" onclick="tjClose(${t.id})">确定平仓</button>
    </div>
  </div>`;

function tjToggleClose(id) {
  const el = document.getElementById('tj-close-' + id);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function tjClose(id) {
  const sd = document.getElementById('tj-sd-' + id).value;
  const sp = parseFloat(document.getElementById('tj-sp-' + id).value);
  if (!sd) { alert('请填卖出日'); return; }
  if (isNaN(sp) || sp <= 0) { alert('请填卖出价'); return; }
  const body = { id, sellDate: sd, sellPrice: sp, sellReason: document.getElementById('tj-sr-' + id).value || '' };
  try {
    const r = await (await fetch('/api/journal/close', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })).json();
    if (!r.ok) { alert('平仓失败：' + (r.error || '')); return; }
    loadJournal();
  } catch (e) { alert('平仓失败：' + e); }
}

let simChart = null;

function simFmtDate(v) {
  if (v == null) return '';
  if (typeof v === 'number') return new Date(v).toISOString().slice(0, 10);
  return String(v).slice(0, 10);
}
function simMoney(v) { return v == null ? '-' : Number(v).toLocaleString('zh-CN', { maximumFractionDigits: 0 }); }
function simPnlSpan(v) {
  const n = Number(v || 0);
  const c = n > 0 ? '#dc2626' : n < 0 ? '#15803d' : '#6b7280';
  return `<span style="color:${c};font-weight:700">${n > 0 ? '+' : ''}${n.toFixed(2)}%</span>`;
}

let simStrategy = 'A';

let simSnaps = { A: null, B: null, C: null };

function onSimStrategyChange() {
  simStrategy = document.getElementById('sim-strategy-select').value || 'A';
  loadSimOverview();
}

async function loadSimOverview() {
  const body = document.getElementById('sim-body');
  body.innerHTML = '<div class="dim" style="padding:36px;text-align:center">加载中…</div>';
  try {
    const [a, b, c] = await Promise.all(['A', 'B', 'C'].map(s =>
      fetch('/api/sim/overview?strategy=' + s).then(r => r.json()).catch(() => null)));
    simSnaps = { A: a, B: b, C: c };
  } catch (e) {}
  const d = simSnaps[simStrategy];
  if (!d || d.totalValue == null) {
    body.innerHTML = '<div class="dim" style="padding:36px;text-align:center">加载失败，稍后重试</div>';
    return;
  }
  renderSim(d);
}

let simRunPollTimer = null;

async function simRunNow() {
  if (!confirm('立即执行一次结算？')) return;
  const meta = document.getElementById('sim-meta');
  let prevMark = null;
  try { prevMark = (await (await fetch('/api/sim/run-result')).json()).finishedAt || null; } catch (e) {}
  try {
    await fetch('/api/sim/run?strategy=all', { method: 'POST' });
    if (meta) meta.textContent = '结算中…';
    simStartRunPolling(prevMark);
  } catch (e) { alert('触发失败：' + e); }
}

function simStartRunPolling(prevMark) {
  if (simRunPollTimer) clearInterval(simRunPollTimer);
  const startedAt = Date.now();
  simRunPollTimer = setInterval(async () => {
    let d = null;
    try { d = await (await fetch('/api/sim/run-result')).json(); } catch (e) { return; }
    if (!d || !d.finishedAt || d.finishedAt === prevMark) {
      if (Date.now() - startedAt > 5 * 60 * 1000) {
        clearInterval(simRunPollTimer); simRunPollTimer = null;
        const meta = document.getElementById('sim-meta');
        if (meta) meta.textContent = '结算耗时超预期，请稍后点「刷新」查看';
      }
      return;
    }
    clearInterval(simRunPollTimer); simRunPollTimer = null;
    renderSimRunResult(d);
    loadSimOverview();
  }, 5000);
}

function renderSimRunResult(d) {
  const parts = [];
  ['A', 'B', 'C'].forEach(s => {
    const r = d[s];
    if (!r) return;
    if (r.skipped) parts.push(`${s}：跳过（${r.skipped}）`);
    else if (r.error) parts.push(`${s}：失败（${r.error}）`);
    else {
      const f = (r.filled || []).length, n = (r.newOrders || []).length;
      parts.push(`${s}：成交${f}笔 / 新指令${n}条`);
    }
  });
  const meta = document.getElementById('sim-meta');
  if (meta) meta.textContent = '结算完成 · ' + parts.join(' · ');
  const detail = ['A', 'B', 'C'].map(s => {
    const r = d[s];
    if (!r) return null;
    if (r.skipped) return `【${s}】跳过：${r.skipped}`;
    if (r.error) return `【${s}】失败：${r.error}`;
    const lines = [].concat(r.filled || [], r.newOrders || []);
    return `【${s}】数据日 ${r.dataDate || '-'}\n` + (lines.length ? lines.map(x => '  · ' + x).join('\n') : '  （无成交、无新指令）');
  }).filter(Boolean).join('\n\n');
  alert('结算完成\n\n' + detail);
}

async function simManual() {
  const side = (prompt('方向：输入 buy（补录买入）或 sell（手动卖出）', 'buy') || '').trim().toLowerCase();
  if (side !== 'buy' && side !== 'sell') return;
  const code = (prompt('股票代码（6位数字）') || '').trim();
  if (!/^\d{6}$/.test(code)) { alert('代码格式不对'); return; }
  const qty = parseInt(prompt(side === 'buy' ? '股数（100的整数倍）' : '卖出股数', '100'), 10);
  if (!qty || qty <= 0) { alert('股数不对'); return; }
  const price = parseFloat(prompt('成交价格（元）'));
  if (!price || price <= 0) { alert('价格不对'); return; }
  if (!confirm(`确认手动${side === 'buy' ? '补录买入' : '卖出'} ${code} ${qty}股 @${price}？\n（直接调整模拟盘持仓和现金，流水留痕）`)) return;
  try {
    const r = await (await fetch('/api/sim/manual?strategy=' + simStrategy, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ side: side.toUpperCase(), code, qty, price }),
    })).json();
    alert(r.ok ? (r.message || '已完成') : ('失败：' + (r.error || '未知错误')));
    if (r.ok) loadSimOverview();
  } catch (e) { alert('请求失败：' + e); }
}

function renderSimCurve() {
  const el = document.getElementById('sim-curve');
  if (!el) return;
  const sa = (simSnaps.A && simSnaps.A.snapshots) || [];
  const sb = (simSnaps.B && simSnaps.B.snapshots) || [];
  const sc = (simSnaps.C && simSnaps.C.snapshots) || [];
  if (!sa.length && !sb.length && !sc.length) {
    el.innerHTML = '<div class="dim" style="padding:24px;text-align:center;font-size:13px;">还没有快照——第一次结算后出曲线</div>';
    return;
  }
  // 并集日期
  const dset = new Set();
  [sa, sb, sc].forEach(arr => arr.forEach(s => dset.add(simFmtDate(s.trade_date))));
  const dates = Array.from(dset).sort();
  const mapPnl = snaps => {
    const m = {};
    const init = 100000;
    snaps.forEach(s => { m[simFmtDate(s.trade_date)] = +((Number(s.total_value) / init - 1) * 100).toFixed(2); });
    return m;
  };
  const ma = mapPnl(sa), mb = mapPnl(sb), mc = mapPnl(sc);
  // 沪深300 归一化（用有数据的第一天为基）
  let base = null; const hsMap = {};
  [...sa, ...sb, ...sc].sort((x, y) => simFmtDate(x.trade_date) < simFmtDate(y.trade_date) ? -1 : 1)
    .forEach(s => { const dt = simFmtDate(s.trade_date); if (hsMap[dt] == null && s.hs300_close != null) { if (base == null) base = Number(s.hs300_close); hsMap[dt] = +((Number(s.hs300_close) / base - 1) * 100).toFixed(2); } });
  const serA = dates.map(dt => ma[dt] != null ? ma[dt] : null);
  const serB = dates.map(dt => mb[dt] != null ? mb[dt] : null);
  const serC = dates.map(dt => mc[dt] != null ? mc[dt] : null);
  const serHs = dates.map(dt => hsMap[dt] != null ? hsMap[dt] : null);

  if (simChart) { simChart.dispose(); simChart = null; }
  simChart = echarts.init(el);
  simChart.setOption({
    grid: { left: 44, right: 16, top: 26, bottom: 24 },
    tooltip: { trigger: 'axis', valueFormatter: v => (v == null ? '-' : v + '%') },
    legend: { data: ['A·保守', 'B·形态突破', 'C·B2波段', '沪深300'], top: 0, textStyle: { fontSize: 11 } },
    xAxis: { type: 'category', data: dates, axisLabel: { fontSize: 10 } },
    yAxis: { type: 'value', axisLabel: { formatter: '{value}%', fontSize: 10 } },
    series: [
      { name: 'A·保守', type: 'line', connectNulls: true, data: serA, showSymbol: false, lineStyle: { width: 2, color: '#2563eb' } },
      { name: 'B·形态突破', type: 'line', connectNulls: true, data: serB, showSymbol: false, lineStyle: { width: 2, color: '#ea580c' } },
      { name: 'C·B2波段', type: 'line', connectNulls: true, data: serC, showSymbol: false, lineStyle: { width: 2, color: '#16a34a' } },
      { name: '沪深300', type: 'line', connectNulls: true, data: serHs, showSymbol: false, lineStyle: { width: 1.5, type: 'dashed', color: '#94a3b8' } },
    ],
  });
}

async function loadMacroSentinel() {
  const box = document.getElementById('macro-sentinel');
  if (!box) return;
  let d = null;
  try { d = await (await fetch('/api/macro/sentinel')).json(); } catch (e) { return; }
  const runBtn = `<button class="btn-default" style="padding:2px 10px;font-size:12px;margin-left:8px;" onclick="macroSentinelRun()">立即检测</button>`;
  if (!d || !d.level) {
    box.innerHTML = `<div style="padding:9px 12px;border-radius:8px;background:#f8fafc;border:1px dashed #cbd5e1;font-size:12.5px;color:#6b7280;">
      盘前哨兵：还没有检测记录${runBtn}</div>`;
    return;
  }
  const lv = d.level;
  const style = lv === '高' ? ['#fef2f2', '#fecaca', '#991b1b']
             : lv === '中' ? ['#fffbeb', '#fde68a', '#92400e']
             : ['#f0fdf4', '#bbf7d0', '#166534'];
  const items = (d.items || []).map(it => it.ok
    ? `<span style="margin-right:12px;">${esc(it.name)} <b style="color:${Number(it.pct) > 0 ? '#dc2626' : Number(it.pct) < 0 ? '#16a34a' : '#6b7280'}">${Number(it.pct) > 0 ? '+' : ''}${Number(it.pct).toFixed(2)}%</b>${it.hit ? '' : ''}</span>`
    : `<span style="margin-right:12px;color:#9ca3af;">${esc(it.name)} 缺数</span>`).join('');
  box.innerHTML = `<div style="padding:10px 12px;border-radius:8px;background:${style[0]};border:1px solid ${style[1]};font-size:12.5px;line-height:1.8;">
    <b style="color:${style[2]}">盘前哨兵：今日${lv}风险</b>
    <span class="dim" style="font-size:11px;">（${esc(String(d.tradeDate || ''))} ${String(d.checkedAt || '').replace('T', ' ').slice(11, 16)} · 隔夜数据非预测）</span>${runBtn}<br>
    ${items}<br>
    <span style="color:${style[2]}">${esc(d.advice || '')}</span>
  </div>`;
}

async function macroSentinelRun() {
  if (!confirm('立即跑一次盘前哨兵？')) return;
  try { await fetch('/api/macro/sentinel/run', { method: 'POST' }); } catch (e) {}
  loadMacroSentinel();
}

// ===== 涨停情绪温度计 =====
const LIMITUP_STYLES = {
  '亢奋': ['#fef2f2', '#fecaca', '#991b1b'],
  '回暖': ['#fff7ed', '#fed7aa', '#9a3412'],
  '分歧': ['#f8fafc', '#e2e8f0', '#475569'],
  '退潮': ['#f0fdf4', '#bbf7d0', '#166534'],
  '冰点': ['#eff6ff', '#bfdbfe', '#1e40af'],
};

async function loadLimitUpEmotion() {
  const box = document.getElementById('limitup-emotion');
  if (!box) return;
  let d = null;
  try { d = await (await fetch('/api/market/limitup')).json(); } catch (e) { return; }
  const runBtn = `<button class="btn-default" style="padding:2px 10px;font-size:12px;margin-left:8px;" onclick="limitUpRun()">立即拉取</button>`;
  const l = d && d.latest;
  if (!l || !l.level) {
    box.innerHTML = `<div style="padding:9px 12px;border-radius:8px;background:#f8fafc;border:1px dashed #cbd5e1;font-size:12.5px;color:#6b7280;">
      涨停情绪：还没有存档${runBtn}</div>`;
    return;
  }
  const st = LIMITUP_STYLES[l.level] || LIMITUP_STYLES['分歧'];
  const ladder = (l.ladder || []).map(x => `${esc(x.name)}${x.lbc}板`).join('、');
  const inds = (l.topIndustries || []).join('、');
  const squares = (d.recent || []).slice().reverse().map(r => {
    const s = LIMITUP_STYLES[r.level] || LIMITUP_STYLES['分歧'];
    return `<span title="${esc(r.date)} ${esc(r.level)}·涨停${r.zt}·高度${r.maxLbc}" style="display:inline-block;width:14px;height:14px;border-radius:3px;background:${s[1]};border:1px solid ${s[2]}33;margin-right:3px;vertical-align:middle;"></span>`;
  }).join('');
  box.innerHTML = `<div style="padding:10px 12px;border-radius:8px;background:${st[0]};border:1px solid ${st[1]};font-size:12.5px;line-height:1.9;">
    <b style="color:${st[2]}">涨停情绪：${esc(l.level)}</b>
    <span class="dim" style="font-size:11px;">（${esc(String(l.tradeDate || ''))} · ${esc(String(l.timing || ''))}${l.source ? ' · 源:' + esc(String(l.source)) : ''}）</span>${runBtn}<br>
    涨停 <b>${l.ztCount}</b> · 跌停 <b>${l.dtCount}</b> · 炸板率 <b>${l.zbRate}%</b> · 连板高度 <b>${l.maxLbc}</b> · 二板+ <b>${l.lb2Count}</b>
    ${l.yPrem != null ? ` · 昨涨停溢价 <b style="color:${l.yPrem > 0 ? '#dc2626' : '#16a34a'}">${l.yPrem > 0 ? '+' : ''}${l.yPrem}%</b>` : ' · <span class="dim">昨涨停溢价缺数</span>'}<br>
    ${ladder ? `高度榜：${ladder}<br>` : ''}${inds ? `涨停集中：${inds}<br>` : ''}
    <span style="color:${st[2]}">${esc(l.note || '')}</span>
    ${squares ? `<span style="margin-left:12px;">${squares}<span class="dim" style="font-size:11px;margin-left:4px;">近${(d.recent || []).length}日</span></span>` : ''}
  </div>`;
}

async function limitUpRun() {
  if (!confirm('立即拉取今日涨跌停数据？')) return;
  let r = null;
  try { r = await (await fetch('/api/market/limitup/run', { method: 'POST' })).json(); } catch (e) {}
  if (r && r.ok === false) alert(r.message || '拉取失败');

}

async function loadMarketPulse() {
  loadMacroSentinel();
  loadLimitUpEmotion();
  const body = document.getElementById('market-body');
  const timeEl = document.getElementById('market-time');
  body.innerHTML = '<div class="dim" style="padding:36px;text-align:center">加载中…（盘中实时计算约需 10-20 秒）</div>';
  timeEl.textContent = '';
  let p = null;
  try { p = await (await fetch('/api/market/pulse')).json(); } catch (e) {}
  if (!p || typeof p.temperature !== 'number') {
    body.innerHTML = '<div class="dim" style="padding:36px;text-align:center">暂无数据，稍后重试</div>';
    return;
  }
  renderMarketPulse(p);
}

function tempColor(t) {
  if (t >= 78) return '#15803d';
  if (t >= 62) return '#22a06b';
  if (t >= 48) return '#ca8a04';
  if (t >= 32) return '#ea580c';
  return '#b91c1c';
}
function dimColor(v) { return v >= 60 ? '#15803d' : v >= 40 ? '#ca8a04' : '#dc2626'; }
function yi(v) { return (v / 1e8).toFixed(1) + ' 亿'; }
function pctSpan(v) {
  const c = v > 0 ? '#dc2626' : v < 0 ? '#15803d' : '#6b7280';
  return `<span style="color:${c};font-weight:600">${v > 0 ? '+' : ''}${v.toFixed(2)}%</span>`;
}

function renderMarketPulse(p) {
  const col = tempColor(p.temperature);
  document.getElementById('market-time').textContent = (p.tradeDate || '') + ' 研判';

  // 顶部温度 + 仓位建议
  const banner = `
    <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:18px 20px;border-radius:12px;
                background:linear-gradient(135deg, ${col}14, ${col}05);border:1px solid ${col}33;">
      <div style="text-align:center;min-width:120px;">
        <div style="font-size:52px;font-weight:800;line-height:1;color:${col};">${Math.round(p.temperature)}</div>
        <div class="dim" style="font-size:12px;margin-top:4px;">大盘温度 /100</div>
      </div>
      <div style="flex:1;min-width:200px;">
        <div style="font-size:26px;font-weight:800;color:${col};">${p.advice}</div>
        <div class="dim" style="margin-top:6px;font-size:13px;">${p.summary || ''}</div>
        ${p.forcedDefensive ? '<div style="margin-top:6px;color:#b91c1c;font-weight:600;font-size:13px;">已触发风控条件</div>' : ''}
      </div>
    </div>`;

  // 五维分解
  const dims = [
    ['趋势', p.trendScore, '指数均线排列/站上均线'],
    ['宽度', p.breadthScore, '涨跌家数、封板情绪'],
    ['资金', p.capitalScore, '大盘主力资金相对强弱'],
    ['量能', p.volumeScore, '成交额 vs 20日均量'],
    ['动量', p.momentumScore, '指数今日+近5日涨跌'],
  ];
  const dimBars = dims.map(([label, v, hint]) => `
    <div style="display:flex;align-items:center;gap:10px;margin:7px 0;">
      <div style="width:44px;font-weight:600;font-size:13px;">${label}</div>
      <div style="flex:1;background:#f1f5f9;border-radius:6px;height:16px;overflow:hidden;">
        <div style="width:${Math.max(2, v)}%;height:100%;background:${dimColor(v)};transition:width .4s;"></div>
      </div>
      <div style="width:34px;text-align:right;font-weight:600;font-size:13px;color:${dimColor(v)};">${Math.round(v)}</div>
      <div class="dim" style="width:180px;font-size:11px;">${hint}</div>
    </div>`).join('');

  // 指数卡片
  const idxCards = (p.indices || []).map(ix => `
    <div style="flex:1;min-width:130px;border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;">
      <div style="font-weight:700;font-size:14px;">${ix.name}</div>
      <div style="font-size:18px;font-weight:700;margin:2px 0;">${ix.close}</div>
      <div>${pctSpan(ix.changePct)}</div>
      <div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap;">
        <span style="font-size:11px;padding:1px 6px;border-radius:4px;background:${ix.aboveMa20 ? '#dcfce7' : '#fee2e2'};color:${ix.aboveMa20 ? '#15803d' : '#b91c1c'};">${ix.aboveMa20 ? '站上20' : '破20'}</span>
        <span style="font-size:11px;padding:1px 6px;border-radius:4px;background:${ix.aboveMa60 ? '#dcfce7' : '#fee2e2'};color:${ix.aboveMa60 ? '#15803d' : '#b91c1c'};">${ix.aboveMa60 ? '站上60' : '破60'}</span>
        <span style="font-size:11px;padding:1px 6px;border-radius:4px;background:${ix.bullish ? '#dcfce7' : '#f3f4f6'};color:${ix.bullish ? '#15803d' : '#6b7280'};">${ix.bullish ? '多头' : '空头'}</span>
      </div>
    </div>`).join('');

  // 关键数据
  const stats = `
    <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px;">
      <div>涨跌家数 <b style="color:#dc2626">${p.upCount}</b> : <b style="color:#15803d">${p.downCount}</b></div>
      <div>涨停 <b style="color:#dc2626">${p.limitUp}</b> / 跌停 <b style="color:#15803d">${p.limitDown}</b></div>
      <div>两市成交额 <b>${yi(p.totalAmount)}</b></div>
      <div>主力今日净流入 <b style="color:${p.mainNetInflowToday >= 0 ? '#dc2626' : '#15803d'}">${yi(p.mainNetInflowToday)}</b></div>
      <div>近5日 <b style="color:${p.mainNetInflow5d >= 0 ? '#dc2626' : '#15803d'}">${yi(p.mainNetInflow5d)}</b></div>
    </div>`;

  // 理由
  const rmark = k => k === 'good' ? '✓' : k === 'bad' ? '✗' : k === 'warn' ? '!' : '·';
  const rcolor = k => k === 'good' ? '#15803d' : k === 'bad' ? '#dc2626' : k === 'warn' ? '#d97706' : '#6b7280';
  const reasons = (p.reasons || []).map(r =>
    `<div style="padding:3px 0;font-size:13px;color:${rcolor(r.kind)};">${rmark(r.kind)} ${r.text}</div>`).join('');

  document.getElementById('market-body').innerHTML = `
    ${banner}
    <div style="margin-top:18px;font-weight:700;font-size:14px;">五维打分</div>
    <div style="margin-top:8px;">${dimBars}</div>
    <div style="margin-top:18px;font-weight:700;font-size:14px;">四大指数</div>
    <div style="margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;">${idxCards}</div>
    <div style="margin-top:18px;font-weight:700;font-size:14px;">关键数据</div>
    <div style="margin-top:8px;">${stats}</div>
    <div style="margin-top:18px;font-weight:700;font-size:14px;">研判理由</div>
    <div style="margin-top:6px;">${reasons}</div>
    <div class="scan-disclaimer" style="margin-top:16px;">仅辅助参考，不构成投资建议。</div>`;
}

async function rescanScanRes() {
  if (!currentScanResGroup) { alert('请先选择一个分组'); return; }
  const list = document.getElementById('scanres-list');
  const timeEl = document.getElementById('scanres-time');
  let items = [];
  try { items = await fetchWholeGroup(currentScanResGroup); } catch (e) {}
  if (!items.length) {
    list.innerHTML = '<div class="dim" style="padding:20px;text-align:center">该分组没有股票</div>';
    return;
  }
  list.innerHTML = '<div class="dim" style="padding:16px">扫描中…</div>';
  const { results, scannedAt } = await scanGroupStocks(currentScanResGroup, items, (done, total) => {
    timeEl.textContent = `扫描中… ${done}/${total}`;
  });
  loadScanResults();
}

function scanLatest(code, name) {
  closeScanModal();
  closeAnalyzeModal();
  refreshLatest(code, name);
}

function scanOpenKline(code, name) {
  closeScanModal();
  closeAnalyzeModal();
  lastKlineCode = null;
  // 同步选中左侧列表行（若在当前过滤视图中）
  document.querySelectorAll('#rows tr.row-selected').forEach(el => el.classList.remove('row-selected'));

  if (tr) tr.classList.add('row-selected');

// ===== 单只个股分析 =====
function closeAnalyzeModal() { document.getElementById('analyzeModal').style.display = 'none'; }

async function analyzeStock(code, name) {
  document.getElementById('analyzeTitle').textContent = `个股分析 · ${name || ''}（${code}）`;
  document.getElementById('analyzeBody').innerHTML =
      '<div class="dim" style="font-size:13px">分析中… 正在拉取日 K</div>';
  document.getElementById('analyzeModal').style.display = 'flex';
  let res, adv;
  try {
    const r = await fetch('/api/kline/' + code + '?days=130');
    const d = await r.json();
    const bars = d.bars || [];
    res = scoreStock(bars, d.rps);
    const mkt = await getMarketLast();
    adv = expertAdvice(bars, { market: mkt });
  } catch (e) {
    document.getElementById('analyzeBody').innerHTML =
        '<div class="r r-warn">分析失败：K 线获取失败</div>';
    return;
  }
  const scoreTxt = res.score >= 0 ? `${res.score}<span class="u">/100</span>` : '—';
  const reasons = res.reasons.map(x =>
      `<div class="r r-${x.kind}" style="font-size:13px;line-height:1.7;">${scanMark(x.kind)} ${x.text}</div>`).join('');
  const nm = (name || '').replace(/'/g, '');
  document.getElementById('analyzeBody').innerHTML =
    `<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
       <span class="lvl lvl-s${res.tier}" style="font-size:14px;padding:4px 14px;">${res.level}</span>
       <span class="scan-score" style="font-size:22px;">${scoreTxt}</span>
       <span class="sp" style="flex:1"></span>
       <button class="btn-default" style="padding:6px 14px;" onclick="scanOpenKline('${code}','${nm}')">查看 K 线 →</button>
     </div>
     <div class="scan-reasons" style="margin-left:0;">${reasons}</div>
     <div style="border-top:1px solid #eef1f4;margin-top:14px;padding-top:12px;">
       ${renderExpertHtml(adv)}
     </div>
     ${renderSuspHtml(res._susp)}
     <div class="scan-disclaimer" style="border-top:1px solid #eef1f4;margin-top:14px;padding:10px 0 0;">
       仅辅助参考，不构成投资建议。
     </div>`;
}

// 清空全部筛选（状态变量 + 控件同步归零）

  scanResBLabel = ''; scanResBDays = null; scanResXLabel = ''; scanResXDays = null;

switchTab('market');

// ===== K线预热状态 =====
async function refreshWarmStatus() {
  try {
    const d = await (await fetch('/api/watch/warm-status')).json();
    const el = document.getElementById('subtitle');
    if (!el) return;
    let head;
    if (d.running) {
      head = `K线刷新中… ${d.done || 0}/${d.total || '?'}（开始于 ${String(d.startedAt || '').slice(11, 16)}）`;
    } else if (d.last) {
      const L = typeof d.last === 'string' ? JSON.parse(d.last) : d.last;
      head = `K线数据更新于 ${String(L.finishedAt || '').replace('T', ' ').slice(5, 16)} · 成功 ${L.fetched}/${L.total}${L.failed ? `（失败 ${L.failed}）` : ''}`;
    } else {
      head = 'K线数据还未预热——点右上「刷新自选K线」';
    }
    el.textContent = head + ' ｜ 大盘研判 15:05 / 预热 16:05 / 模拟盘 19:30 自动';
  } catch (e) { /* 状态拿不到不影响页面 */ }
}
refreshWarmStatus();
setInterval(refreshWarmStatus, 60000);
