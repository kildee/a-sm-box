<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>指标复盘盒子</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         margin: 0; padding: 24px; background: #f4f6f9; color: #1f2328; }
  h1 { margin: 0 0 4px; font-size: 24px; font-weight: 600; }
  .subtitle { color: #6b7280; font-size: 13px; margin-bottom: 16px; }

  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid #e5e7eb; }
  .tab { padding: 10px 20px; cursor: pointer; font-size: 14px; font-weight: 500;
         color: #6b7280; border-bottom: 2px solid transparent; transition: all .15s; }
  .tab:hover { color: #1f2328; }
  .tab.active { color: #2563eb; border-bottom-color: #2563eb; }

  .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.05);
          padding: 16px 20px; margin-bottom: 16px; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .toolbar .spacer { flex: 1; }
  .toolbar .meta { color: #6b7280; font-size: 13px; }
  .toolbar select, .toolbar input[type="date"] {
    padding: 8px 12px; border-radius: 6px; border: 1px solid #d1d5db;
    font-size: 13px; background: #fff;
  }

  button { padding: 9px 18px; border-radius: 6px; cursor: pointer; font-size: 14px;
           font-weight: 500; transition: all .15s; border: 1px solid transparent;
           display: inline-flex; align-items: center; gap: 6px; }
  button:disabled { cursor: not-allowed; opacity: .55; }
  .btn-primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
  .btn-success { background: #16a34a; color: #fff; border-color: #16a34a; }
  .btn-success:hover:not(:disabled) { background: #15803d; }
  .btn-default { background: #fff; color: #374151; border-color: #d1d5db; }
  .btn-default:hover:not(:disabled) { background: #f3f4f6; }

  .status { margin-top: 10px; font-size: 13px; }
  .status.info    { color: #2563eb; }
  .status.success { color: #16a34a; }
  .status.error   { color: #dc2626; }

  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: right; font-size: 13px;
           border-bottom: 1px solid #eef1f4; }
  th { background: #f9fafb; color: #4b5563; font-weight: 600; text-align: right;
       position: sticky; top: 0; }
  th:first-child, td:first-child,
  th:nth-child(2), td:nth-child(2),
  th:nth-child(3), td:nth-child(3) { text-align: left; }
  .up { color: #dc2626; font-weight: 500; }
  .dn { color: #16a34a; font-weight: 500; }
  tr:hover td { background: #fafbfd; }
  code { font-family: SFMono-Regular, Menlo, monospace; color: #2563eb; }
  .warn { color: #d97706; font-weight: 500; }
  .dim { color: #9ca3af; }
  .empty { text-align: center; color: #9ca3af; padding: 40px 0 !important; }

  /* chip */
  .chip { padding: 5px 12px; border-radius: 16px; border: 1px solid #e5e7eb;
          background: #fff; color: #4b5563; font-size: 12px; cursor: pointer;
          transition: all .15s; }
  .chip:hover { border-color: #9ca3af; }
  .chip.chip-active { background: #2563eb; color: #fff; border-color: #2563eb; }

  /* 弹窗 */
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4);
                display: flex; align-items: center; justify-content: center;
                z-index: 100; }
  .modal { background: #fff; border-radius: 12px; max-width: 90%; max-height: 85%;
           width: 1100px; overflow: hidden; display: flex; flex-direction: column;
           box-shadow: 0 25px 60px rgba(0,0,0,.25); }
  .modal-header { padding: 16px 24px; border-bottom: 1px solid #eef1f4;
                  display: flex; justify-content: space-between; align-items: center; }
  .modal-title { font-size: 18px; font-weight: 600; }
  .modal-close { cursor: pointer; font-size: 20px; color: #6b7280;
                 border: none; background: transparent; padding: 0 4px; }
  .modal-body { overflow-y: auto; padding: 0; }

  .split-layout { display: flex; gap: 16px; align-items: flex-start; }
  .split-layout .col-left  { flex: 1; min-width: 0; }
  body.split-mode .split-layout .col-left  { flex: 0 0 32%; }
  body.split-mode .split-layout .col-right { flex: 1 1 auto; min-width: 0; }
  .kline-card { background: #fff; border-radius: 10px; padding: 14px 16px;
                box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .kline-title { font-size: 14px; font-weight: 600; margin-bottom: 8px;
                 color: #1f2328; display: flex; justify-content: space-between; align-items: baseline; }
  .kline-title .sub { font-size: 12px; color: #6b7280; font-weight: 400; }
  .kline-canvas { height: 640px; }
  .kline-empty { height: 640px; display: flex; align-items: center;
                 justify-content: center; color: #9ca3af; font-size: 13px; }
  .kline-advice { padding: 9px 12px; margin: 4px 0 10px;
                  border-radius: 6px; font-size: 13px; line-height: 1.7;
                  background: #f9fafb; border-left: 3px solid #e5e7eb; }
  .kline-advice .label { color: #6b7280; margin-right: 6px; }
  .kline-advice.advice-buy  { background: #f0fdf4; border-left-color: #16a34a; }
  .kline-advice.advice-sell { background: #fef2f2; border-left-color: #dc2626; }
  .kline-advice.advice-hold { background: #fffbeb; border-left-color: #f59e0b; }
  .kline-advice.advice-wait { background: #f3f4f6; border-left-color: #9ca3af; }
  /* 自选分组双栏：行可点击 */
  body.split-mode #rows tr { cursor: pointer; }
  body.split-mode #rows tr.row-selected td { background: #eff6ff !important; }

  .filter-group { display: inline-flex; gap: 8px; align-items: center; }

  /* 顶部栏 */
  .topbar { display: flex; align-items: flex-start; justify-content: space-between;
            gap: 16px; margin-bottom: 4px; }
  .topbar .top-actions { font-size: 13px; color: #4b5563; display: flex; align-items: center;
                      gap: 10px; padding-top: 6px; }
  .topbar .top-actions .link-btn { background: none; border: none; color: #2563eb;
                                cursor: pointer; font-size: 13px; padding: 0;
                                text-decoration: underline; text-underline-offset: 2px; }
  .topbar .top-actions .link-btn:hover { color: #1d4ed8; }

  /* 指标扫描 */
  .scan-modal .modal { width: 920px; }
  .scan-modal .modal-body { padding: 0; }
  .scan-progress { padding: 11px 20px; color: #4b5563; font-size: 13px;
                   border-bottom: 1px solid #eef1f4; background: #f9fafb; }
  .scan-list { max-height: 68vh; overflow-y: auto; }
  .scan-row { padding: 13px 20px; border-bottom: 1px solid #f1f3f5; cursor: pointer; }
  .scan-row:hover { background: #f1f5ff; }
  .scan-row .head { display: flex; align-items: center; gap: 10px; }
  .scan-row .rank { color: #9ca3af; font-size: 13px; min-width: 22px; }
  .scan-row .nm { font-weight: 600; }
  .scan-row .cd { color: #2563eb; font-family: SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .scan-row .sp { flex: 1; }
  .scan-score { font-weight: 700; font-size: 15px; color: #1f2328; }
  .scan-score .u { font-size: 11px; color: #9ca3af; font-weight: 400; }
  .lvl { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .lvl-s5 { background: #fee2e2; color: #b91c1c; }   /* A档 */
  .lvl-s4 { background: #dcfce7; color: #15803d; }   /* B档 */
  .lvl-s3 { background: #fef3c7; color: #b45309; }   /* C档 */
  .lvl-s2 { background: #e5e7eb; color: #4b5563; }   /* D档 */
  .lvl-s1 { background: #1f2937; color: #fca5a5; }   /* E档 */
  .lvl-s0 { background: #f3f4f6; color: #9ca3af; }   /* 失败/数据不足 */
  .scan-reasons { margin: 8px 0 0 32px; display: flex; flex-direction: column; gap: 3px; }
  .scan-reasons .r { font-size: 12px; line-height: 1.5; }
  .r-good { color: #15803d; }
  .r-warn { color: #b45309; }
  .r-bad  { color: #b91c1c; }
  .r-neutral { color: #6b7280; }
  .scan-disclaimer { padding: 10px 20px; font-size: 11px; color: #9ca3af;
                     border-top: 1px solid #eef1f4; }
  .bt-table th, .bt-table td { padding: 6px 8px; border-bottom: 1px solid #eef1f4; text-align: center; white-space: nowrap; }
  .bt-table th { font-weight: 600; color: #475569; }
  .bt-table tbody tr:hover { background: #f8fafc; }

  // ===== 响应式 =====
  @media (max-width: 820px) {
    body { padding: 12px; }
    h1 { font-size: 20px; }
    .subtitle { font-size: 12px; }

    .topbar { flex-direction: column; align-items: stretch; gap: 6px; }
    .topbar .top-actions { padding-top: 0; flex-wrap: wrap; gap: 8px; font-size: 12px; }

    .tabs { overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { padding: 10px 14px; flex: 0 0 auto; }

    .card { padding: 12px 14px; }
    button { padding: 8px 12px; }

    body.split-mode .split-layout { flex-direction: column; }
    body.split-mode .split-layout .col-left,
    body.split-mode .split-layout .col-right { flex: 1 1 auto; width: 100%; min-width: 0; }

    #list-card { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    #list-card table { min-width: 560px; }

    .kline-canvas, .kline-empty { height: 380px; }

    /* 弹窗占满宽度 */
    .modal { width: 95vw !important; max-width: 95vw; }
    .scan-modal .modal { width: 95vw; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>指标复盘盒子</h1>
    <div class="subtitle" id="subtitle">大盘研判 15:05 / 自选K线预热 16:05 / 模拟盘 19:30 自动更新；也可手动触发</div>
  </div>
  <div class="top-actions">
    <button class="link-btn" onclick="refreshAllData()">刷新自选K线</button>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="market"    onclick="switchTab('market')">大盘研判</div>
  <div class="tab"        data-tab="watch"     onclick="switchTab('watch')">自选分组</div>
  <div class="tab"        data-tab="scanresult" onclick="switchTab('scanresult')">扫描结果</div>
  <div class="tab"        data-tab="sim"       onclick="switchTab('sim')">模拟盘</div>
  <div class="tab"        data-tab="journal"   onclick="switchTab('journal')">复盘日记</div>
</div>

<!-- 模拟盘 -->
<div class="card" id="sim-card" style="display:none;">
  <div class="toolbar" style="gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;">
    <span class="meta">策略:</span>
    <select id="sim-strategy-select" onchange="onSimStrategyChange()" style="min-width:150px;">
      <option value="A">A · 保守综合</option>
      <option value="B">B · 形态突破</option>
      <option value="C">C · B2波段</option>
    </select>
    <button class="btn-default" onclick="loadSimOverview()">刷新</button>
    <button class="btn-success" id="sim-run-btn" onclick="simRunNow()">▶ 立即结算(全部)</button>
    <button class="btn-default" id="sim-manual-btn" onclick="simManual()">✎ 手动矫正</button>
    <button class="btn-default" id="sim-reset-btn" style="color:#dc2626;border-color:#fecaca;" onclick="simReset()">重置模拟盘</button>
    <div class="spacer"></div>
    <span class="meta" id="sim-meta"></span>
  </div>
  <div id="sim-body"><div class="dim" style="padding:36px;text-align:center">加载中…</div></div>
</div>

<!-- 复盘日记 -->
<div class="card" id="journal-card" style="display:none;">
  <div class="toolbar" style="gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:6px;">
    <div><div class="dim" style="font-size:11px;">代码</div><input id="tj-code" placeholder="600000" style="width:90px;padding:7px 9px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;"></div>
    <div><div class="dim" style="font-size:11px;">名称</div><input id="tj-name" placeholder="选填" style="width:90px;padding:7px 9px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;"></div>
    <div><div class="dim" style="font-size:11px;">买入日</div><input id="tj-bdate" type="date" style="padding:7px 9px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;"></div>
    <div><div class="dim" style="font-size:11px;">买入价</div><input id="tj-bprice" type="number" step="0.001" placeholder="10.20" style="width:80px;padding:7px 9px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;"></div>
    <div><div class="dim" style="font-size:11px;">股数</div><input id="tj-qty" type="number" step="100" placeholder="500" style="width:80px;padding:7px 9px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;"></div>
    <div style="flex:1;min-width:140px;"><div class="dim" style="font-size:11px;">买入理由/计划</div><input id="tj-reason" placeholder="如：平台突破回踩买点，止损7.6" style="width:100%;padding:7px 9px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;"></div>
    <button class="btn-success" onclick="tjAddBuy()">＋ 记录买入</button>
    <button class="btn-default" onclick="loadJournal()">刷新</button>
  </div>
  <div id="journal-stats" style="margin:8px 0;"></div>
  <div id="journal-tagstats" style="margin:8px 0;"></div>
  <div id="journal-body"><div class="dim" style="padding:30px;text-align:center">还没有记录。上面填一笔买入开始记你的交易复盘。</div></div>
</div>

<!-- 大盘研判 -->
<div class="card" id="market-card" style="display:none;">
  <div id="macro-sentinel" style="margin-bottom:12px;"></div>
  <div id="limitup-emotion" style="margin-bottom:12px;"></div>
  <div class="toolbar" style="gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;">
    <button class="btn-default" onclick="loadMarketPulse()">刷新</button>
    <div class="spacer"></div>
    <span class="meta" id="market-time"></span>
  </div>
  <div id="market-body"><div class="dim" style="padding:36px;text-align:center">加载中…</div></div>
</div>

<!-- 自选分组专用工具栏 -->
<div class="card" id="watch-toolbar" style="display:none;">
  <div class="toolbar" style="gap:8px;flex-wrap:wrap;">
    <span class="meta">分组:</span>
    <select id="watch-group-select" onchange="onWatchGroupChange()" style="min-width:140px;"></select>
    <button class="btn-success" id="watch-scan-btn" onclick="scanGoodStocks()">指标扫描</button>
    <button class="btn-default" id="watch-new-group-btn" onclick="createWatchGroup()">+ 新建分组</button>
    <button class="btn-default" id="watch-del-group-btn" onclick="deleteWatchGroup()" style="color:#dc2626;border-color:#fecaca;">删除当前分组</button>
    <button class="btn-default" id="watch-export-btn" onclick="exportWatchCodes()">导出代码</button>
    <input id="watch-search" type="search" placeholder="搜名称或代码" oninput="onWatchSearch()"
           style="padding:8px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;min-width:180px;">
    <div class="spacer"></div>
    <span class="meta" id="watch-count"></span>
  </div>
  <div class="toolbar" id="watch-add-row" style="gap:8px;margin-top:10px;align-items:flex-start;">
    <textarea id="watch-input" rows="2" placeholder="录入股票名称或代码，支持换行/逗号/空格分隔，例如：贵州茅台 中际旭创 002436"
              style="flex:1;padding:8px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;resize:vertical;"></textarea>
    <button class="btn-primary" id="watch-add-btn" onclick="addWatchStocks()" style="white-space:nowrap;">添加到分组</button>
  </div>
  <div class="status" id="watch-status"></div>
</div>

<!-- 扫描结果专用工具栏 -->
<div class="card" id="scanres-toolbar" style="display:none;">
  <div class="toolbar" style="gap:8px;flex-wrap:wrap;">
    <span class="meta">分组:</span>
    <select id="scanres-group-select" onchange="onScanResGroupChange()" style="min-width:140px;"></select>
    <span class="filter-group">
    <span class="meta">B点:</span>
    <select id="scanres-bpoint-select" onchange="onScanResBpChange()" style="min-width:80px;">
      <option value="">全部</option>
      <option value="B1">B1</option>
      <option value="B2">B2</option>
      <option value="B3">B3</option>
    </select>
    <input id="scanres-bdays" type="number" min="0" max="60" placeholder="?天内" oninput="onScanResBpChange()"
           style="width:78px;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;">
    </span>
    <span class="filter-group">
    <span class="meta">均线:</span>
    <select id="scanres-cross-select" onchange="onScanResCrossChange()" style="min-width:96px;">
      <option value="">全部</option>
      <option value="金叉">金叉</option>
      <option value="死叉">死叉</option>
    </select>
    <input id="scanres-xdays" type="number" min="0" max="60" placeholder="?天内" oninput="onScanResCrossChange()"
           style="width:78px;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;">
    </span>
    <span class="filter-group">
    <span class="meta">连续买点:</span>
    <input id="scanres-bcount" type="number" min="1" max="9" placeholder="≥N个" oninput="onScanResBcChange()"
           style="width:78px;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;">
    </span>
    <span class="filter-group">
    <span class="meta">趋势:</span>
    <select id="scanres-regime-select" onchange="onScanResRegimeChange()" style="min-width:110px;">
      <option value="">全部</option>
      <option value="UP_ANY">↗ 任一上升</option>
      <option value="UPTREND">上升趋势</option>
      <option value="RANGE_UP">震荡上升</option>
      <option value="BOTTOMING">筑底中</option>
      <option value="REBOUND">反弹中</option>
      <option value="RANGE">震荡</option>
      <option value="TOPPING">疑似见顶</option>
      <option value="DOWNTREND">下降趋势</option>
    </select>
    </span>
    <button class="btn-success" id="scanres-rescan-btn" onclick="rescanScanRes()">重新扫描</button>
    <button class="btn-default" id="scanres-export-btn" onclick="exportScanRes()" title="导出当前筛选下全部名称+代码(CSV)">导出结果</button>
    <button class="btn-default" onclick="clearScanFilters()" title="清空全部筛选条件">清空</button>
    <input id="scanres-search" type="search" placeholder="搜名称或代码" oninput="onScanResSearch()"
           style="padding:8px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;min-width:160px;">
    <div class="spacer"></div>
    <span class="meta" id="scanres-time"></span>
  </div>
</div>

<div id="split-layout" class="split-layout">
  <div class="col-left">
    <div class="card" id="list-card" style="padding: 0; overflow: hidden;">
      <table>
        <thead id="thead"></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="watch-pager" style="display:none; justify-content:center; padding:10px 4px; font-size:12px; color:#9ca3af;">
      <span id="pg-info"></span>
    </div>
    <div class="card" id="scanres-card" style="display:none; padding:0; overflow:hidden;">
      <div id="scanres-list"></div>
    </div>
  </div>
  <div class="col-right" id="kline-side" style="display:none;">
    <div class="kline-card">
      <div class="kline-title">
        <span id="kline-title-text">130 日 K 线趋势</span>
        <span class="sub" id="kline-title-sub">点击左侧任一异动查看</span>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:6px;font-size:12px;align-items:center;">
        <span class="dim" style="margin-right:2px;">算法:</span>
        <button class="chip chip-active strategy-chip" data-strategy="ma" onclick="switchStrategy('ma')">均线金叉死叉</button>
        <button class="chip strategy-chip" data-strategy="chan" onclick="switchStrategy('chan')">背驰法</button>
      </div>
      <div id="kline-advice" class="kline-advice" style="display:none;"></div>
      <div id="kline-canvas" class="kline-canvas"></div>
      <div id="kline-empty" class="kline-empty">点击左侧任一行 → 这里出 130 日 K 线趋势</div>
    </div>
  </div>
</div>

<!-- 指标扫描结果 modal -->
<div class="modal-mask scan-modal" id="scanModal" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">指标扫描 · <span id="scanGroupName"></span></div>
      <button class="modal-close" onclick="closeScanModal()">×</button>
    </div>
    <div class="scan-progress" id="scanProgress">准备中…</div>
    <div class="modal-body" id="scanModalBody">
      <div class="scan-list" id="scanList"></div>
    </div>
  </div>
</div>

<!-- 个股分析 modal -->
<div class="modal-mask scan-modal" id="analyzeModal" style="display:none">
  <div class="modal" style="width:560px">
    <div class="modal-header">
      <div class="modal-title" id="analyzeTitle">个股分析</div>
      <button class="modal-close" onclick="closeAnalyzeModal()">×</button>
    </div>
    <div class="modal-body" id="analyzeBody" style="padding:18px 22px;"></div>
  </div>
</div>

<script>
const WATCH_COLS = ['#', '代码', '名称', '操作'];
const WATCH_EMPTY_MSG = '当前分组还没有股票，在上方录入名称/代码后点「添加到分组」';

function renderWatchRow(it, i) {
  const nm = (it.name || '').replace(/'/g, '');
  const analyzeBtn = `<button class="btn-default" style="padding:3px 10px;font-size:12px;margin-right:6px;color:#2563eb;border-color:#bfdbfe;"
        onclick="event.stopPropagation();analyzeStock('${it.code}','${nm}')">分析</button>`;
  const latestBtn = `<button class="btn-default" style="padding:3px 10px;font-size:12px;margin-right:6px;color:#16a34a;border-color:#bbf7d0;"
        onclick="event.stopPropagation();refreshLatest('${it.code}','${nm}')">最新</button>`;
  const removeBtn = `<button class="btn-default" style="padding:3px 10px;font-size:12px;color:#dc2626;border-color:#fecaca;"
        onclick="event.stopPropagation();removeWatchStock('${it.code}','${nm}')">移除</button>`;
  return `<tr data-code="${it.code}" data-name="${it.name}" data-secid="${it.secid}" onclick="onWatchRowClick(this)">
    <td>${i+1}</td>
    <td><code>${it.code}</code></td>
    <td>${it.name}</td>
    <td style="white-space:nowrap;">${analyzeBtn}${latestBtn}${removeBtn}</td>
  </tr>`;
}

let currentTab = 'market';

// ===== 右侧 K 线趋势图 =====
let klineChart = null;
let lastKlineCode = null;
let lastKlineName = '';
let lastKlineBars = null;
let currentStrategy = 'ma';

// ===== ATR / 吊灯止损 =====
function atr22At(sorted, i) {
  if (i < 22) return null;
  let s = 0;
  for (let j = i - 21; j <= i; j++) {
    const h = sorted[j].high, l = sorted[j].low, pc = sorted[j - 1].close;
    s += Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc));
  }
  return s / 22;
}
function chandelierAt(sorted, i) {
  const a = atr22At(sorted, i);
  if (a == null) return null;
  let hh = -Infinity;
  for (let j = i - 21; j <= i; j++) hh = Math.max(hh, sorted[j].high);
  return hh - 3 * a;
}

function coilScore(sorted) {
  const n = sorted.length;
  if (n < 70) return null;
  const i = n - 1;
  const close = sorted[i].close;
  if (!(close > 0)) return null;
  const ma60s = maSeries(sorted, 60);
  if (ma60s[i] != null && close <= ma60s[i]) return null;
  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const avgAmp = (from, to) => {
    let s = 0, c = 0;
    for (let j = from; j <= to; j++) {
      const pc = sorted[j - 1].close;
      if (pc <= 0) continue;
      s += (sorted[j].high - sorted[j].low) / pc; c++;
    }
    return c === 0 ? NaN : s / c;
  };
  const recent = avgAmp(i - 9, i), prior = avgAmp(i - 29, i - 10);
  if (isNaN(recent) || isNaN(prior) || prior <= 0) return null;
  const s1 = clamp01((1.0 - recent / prior) / 0.5) * 35;
  let rv = 0, pv = 0;
  for (let j = i - 9; j <= i; j++) rv += sorted[j].volume;
  for (let j = i - 29; j <= i - 10; j++) pv += sorted[j].volume;
  rv /= 10; pv /= 20;
  const s2 = pv <= 0 ? 0 : clamp01((1.0 - rv / pv) / 0.4) * 25;
  let hi = -Infinity, lo = Infinity;
  for (let j = i - 14; j <= i; j++) { hi = Math.max(hi, sorted[j].high); lo = Math.min(lo, sorted[j].low); }
  const s3 = clamp01((0.20 - (hi - lo) / close) / 0.12) * 15;
  const s4 = (ma60s[i] != null && ma60s[i - 10] != null && ma60s[i] > ma60s[i - 10]) ? 15 : 5;
  // ⑤ 反复接货 10：近15根非潜在背驰买点数
  let bc = 0;
  for (const g of computeChanSignals(sorted)) {
    if (!g.potential && g.type === 'buy' && (i - g.index) < 15) bc++;
  }
  const s5 = bc >= 2 ? 10 : bc === 1 ? 5 : 0;
  return Math.round(s1 + s2 + s3 + s4 + s5);
}

function switchStrategy(s) {
  if (currentStrategy === s) return;
  currentStrategy = s;
  document.querySelectorAll('.strategy-chip').forEach(el => {
    el.classList.toggle('chip-active', el.dataset.strategy === s);
  });
  if (lastKlineBars && lastKlineBars.length) renderKline(lastKlineBars);
}

function ensureKlineChart() {
  if (klineChart) return klineChart;
  const el = document.getElementById('kline-canvas');
  klineChart = echarts.init(el);
  window.addEventListener('resize', () => klineChart.resize());
  return klineChart;
}

function sizeSplitPanels() {
  const layout = document.getElementById('split-layout');
  const leftCards = document.querySelectorAll('#split-layout .col-left .card');
  const right = document.getElementById('kline-side');
  const inSplit = document.body.classList.contains('split-mode');

  // 右栏永远不内部滚动：清掉可能残留的高度限制
  if (right) { right.style.maxHeight = ''; right.style.overflowY = ''; }

  if (!inSplit || !layout) {  // 非分栏 Tab：左栏还原成整页滚动
    leftCards.forEach(c => { c.style.maxHeight = ''; c.style.overflowY = ''; });
    return;
  }
  let h;
  if (window.innerWidth <= 820) {
    h = Math.max(320, Math.floor(window.innerHeight * 0.6));
  } else {
    const top = layout.getBoundingClientRect().top;
    h = Math.max(720, Math.floor(window.innerHeight - top - 12));
  }
  leftCards.forEach(c => { c.style.maxHeight = h + 'px'; c.style.overflowY = 'auto'; });
}

function loadKline(code, name) {
  if (code === lastKlineCode) return;  // 重复点同一只跳过
  lastKlineCode = code;
  lastKlineName = name;
  lastKlineBars = null;
  document.getElementById('kline-title-text').textContent =
      `${name} (${code}) · 130 日 K 线`;
  document.getElementById('kline-title-sub').textContent = '加载中…';
  document.getElementById('kline-empty').style.display = 'none';

  fetch('/api/kline/' + code + '?days=130')
      .then(r => r.json())
      .then(data => {
        if (!data.bars || data.bars.length === 0) {
          document.getElementById('kline-title-sub').textContent = '无 K 线数据';
          document.getElementById('kline-empty').style.display = 'flex';
          document.getElementById('kline-empty').textContent = '该股暂无 K 线数据';
          document.getElementById('kline-advice').style.display = 'none';
          return;
        }
        lastKlineBars = data.bars;
        renderKline(data.bars);
        document.getElementById('kline-title-sub').textContent =
            `${data.bars.length} 个交易日 · MA5/10/20`;
      })
      .catch(e => {
        document.getElementById('kline-title-sub').textContent = '加载失败';
        document.getElementById('kline-empty').style.display = 'flex';
        document.getElementById('kline-empty').textContent = '加载失败: ' + e;
      });
}

/** 按当前策略路由到具体算法 */
function computeSignals(sorted, ma5, ma20) {
  if (currentStrategy === 'chan') return computeChanSignals(sorted);
  return computeMaSignals(sorted, ma5, ma20);
}

function chanBuyReason(label) {
  if (label === 'B1') return '底部分型 + 近期新低';
  if (label === 'B2') return '新底分型不破前低';
  if (label === 'B3') return '突破前高后回踩不破';
  return '背驰信号';
}

function chanSellReason(label) {
  if (label === 'S1') return '顶部分型 + 近期新高';
  if (label === 'S2') return '新顶分型不破前高';
  if (label === 'S3') return '跌破前低反抽不破';
  return '背驰信号';
}

function computeMaSignals(sorted, ma5, ma20) {
  const signals = [];
  let lastType = null, lastIdx = -99;
  for (let i = 1; i < sorted.length; i++) {
    const m5 = ma5[i], m5p = ma5[i-1];
    const m20 = ma20[i], m20p = ma20[i-1];
    if (m5 == null || m5p == null || m20 == null || m20p == null) continue;
    let type = null;
    if (m5p <= m20p && m5 > m20)      type = 'buy';
    else if (m5p >= m20p && m5 < m20) type = 'sell';
    if (!type) continue;
    if (type === lastType && i - lastIdx < 3) continue;
    signals.push({
      index: i, date: sorted[i].tradeDate, type,
      label: type === 'buy' ? 'B' : 'S',
      title: type === 'buy' ? '金叉买点' : '死叉卖点'
    });
    lastType = type; lastIdx = i;
  }
  return signals;
}

function computeChanSignals(sorted) {
  if (sorted.length < 8) return [];
  const signals = [];

  // 1. 识别所有分型
  const fractals = [];
  for (let i = 1; i < sorted.length - 1; i++) {
    const c = sorted[i], p = sorted[i-1], n = sorted[i+1];
    if (c.high > p.high && c.high > n.high && c.low > p.low && c.low > n.low) {
      fractals.push({ index: i, type: 'top', price: c.high });
    } else if (c.low < p.low && c.low < n.low && c.high < p.high && c.high < n.high) {
      fractals.push({ index: i, type: 'bottom', price: c.low });
    }
  }
  if (fractals.length < 2) return [];

  fractals.forEach(f => {
    const lookback = Math.max(0, f.index - 19);
    let low = Infinity, high = -Infinity;
    for (let j = lookback; j <= f.index; j++) {
      if (sorted[j].low < low) low = sorted[j].low;
      if (sorted[j].high > high) high = sorted[j].high;
    }
    if (f.type === 'bottom' && f.price - low < low * 0.02) {
      signals.push({
        index: f.index, date: sorted[f.index].tradeDate, type: 'buy',
        label: 'B1', title: '背驰一买（底部分型，近期新低）'
      });
    } else if (f.type === 'top' && high - f.price < high * 0.02) {
      signals.push({
        index: f.index, date: sorted[f.index].tradeDate, type: 'sell',
        label: 'S1', title: '背驰一卖（顶部分型，近期新高）'
      });
    }
  });

  for (let k = 1; k < fractals.length; k++) {
    const cur = fractals[k];
    // 上一个同向分型
    let prevSame = null, midOpp = false;
    for (let j = k - 1; j >= 0; j--) {
      if (fractals[j].type === cur.type) { prevSame = fractals[j]; break; }
      if (fractals[j].type !== cur.type) midOpp = true;
    }
    if (!prevSame || !midOpp) continue;
    if (cur.type === 'bottom' && cur.price > prevSame.price) {
      signals.push({
        index: cur.index, date: sorted[cur.index].tradeDate, type: 'buy',
        label: 'B2', title: '背驰二买（不破前低，反转确认）'
      });
    } else if (cur.type === 'top' && cur.price < prevSame.price) {
      signals.push({
        index: cur.index, date: sorted[cur.index].tradeDate, type: 'sell',
        label: 'S2', title: '背驰二卖（不破前高，反转确认）'
      });
    }
  }

  for (let k = 2; k < fractals.length; k++) {
    const cur = fractals[k];
    if (cur.type !== 'bottom' && cur.type !== 'top') continue;
    // 找突破点：最近的反向极值
    if (cur.type === 'bottom') {
      let topsAfterFirstBottom = fractals.slice(0, k).filter(f => f.type === 'top');
      if (topsAfterFirstBottom.length < 2) continue;
      const lastTop = topsAfterFirstBottom[topsAfterFirstBottom.length - 1];
      const prevTop = topsAfterFirstBottom[topsAfterFirstBottom.length - 2];
      if (lastTop.price > prevTop.price && cur.price > prevTop.price) {
        signals.push({
          index: cur.index, date: sorted[cur.index].tradeDate, type: 'buy',
          label: 'B3', title: '背驰三买（突破前高回踩不破）'
        });
      }
    } else {
      let bottoms = fractals.slice(0, k).filter(f => f.type === 'bottom');
      if (bottoms.length < 2) continue;
      const lastB = bottoms[bottoms.length - 1];
      const prevB = bottoms[bottoms.length - 2];
      if (lastB.price < prevB.price && cur.price < prevB.price) {
        signals.push({
          index: cur.index, date: sorted[cur.index].tradeDate, type: 'sell',
          label: 'S3', title: '背驰三卖（跌破前低反抽不破）'
        });
      }
    }
  }

  if (sorted.length >= 2) {
    const lastIdx = sorted.length - 1;
    const cur = sorted[lastIdx], prev = sorted[lastIdx - 1];
    if (cur.high < prev.high && cur.low < prev.low) {
      signals.push({
        index: lastIdx, date: sorted[lastIdx].tradeDate, type: 'buy',
        label: '?B', title: '潜在底分型（今日 K 线低于昨日，待明日确认）',
        potential: true
      });
    } else if (cur.high > prev.high && cur.low > prev.low) {
      signals.push({
        index: lastIdx, date: sorted[lastIdx].tradeDate, type: 'sell',
        label: '?S', title: '潜在顶分型（今日 K 线高于昨日，待明日确认）',
        potential: true
      });
    }
  }

  const priority = { B3: 3, S3: 3, B2: 2, S2: 2, B1: 1, S1: 1, '?B': 0, '?S': 0 };
  const bestByIndex = new Map();
  signals.forEach(s => {
    const p = priority[s.label] != null ? priority[s.label] : 0;
    const cur = bestByIndex.get(s.index);
    if (!cur || p > cur.__p) {
      s.__p = p;
      bestByIndex.set(s.index, s);
    }
  });
  return Array.from(bestByIndex.values()).sort((a, b) => a.index - b.index);
}

// ===== 量能口径 =====
function volRatioToday(sorted, i) {
  if (i < 5) return null;
  let s = 0; for (let j = 1; j <= 5; j++) s += sorted[i - j].volume;
  return s > 0 ? sorted[i].volume / (s / 5) : null;
}
function volRatioSustained(sorted, i) {
  if (i < 9) return null;
  let a = 0, b = 0;
  for (let j = 0; j < 5; j++) a += sorted[i - j].volume;
  for (let j = 5; j < 10; j++) b += sorted[i - j].volume;
  return b > 0 ? a / b : null;
}
function volLabelToday(r) {
  if (r == null) return null;
  if (r >= 2.0) return '爆量';
  if (r >= 1.5) return '放量';
  if (r <= 0.5) return '地量';
  if (r <= 0.7) return '缩量';
  return '平量';
}
function volLabelSustained(r) {
  if (r == null) return null;
  if (r >= 1.3) return '放量';
  if (r <= 0.7) return '缩量';
  return '平量';
}

function updateAdvice(sorted, ma5, ma10, ma20, signals) {
  const adviceEl = document.getElementById('kline-advice');
  if (sorted.length < 20) {
    adviceEl.style.display = 'block';
    adviceEl.className = 'kline-advice advice-wait';
    adviceEl.innerHTML = '<span class="dim">数据不足 20 天</span>';
    return;
  }
  const n = sorted.length - 1;
  const m5 = ma5[n], m10 = ma10[n], m20 = ma20[n];
  const close = sorted[n].close;
  const above20 = close > m20;
  const priceVs20 = ((close - m20) / m20 * 100);

  // 趋势状态
  let trend;
  if (m5 > m10 && m10 > m20) {
    trend = '多头排列（上升趋势）';
  } else if (m5 < m10 && m10 < m20) {
    trend = '空头排列（下降趋势）';
  } else {
    trend = '均线纠缠（震荡）';
  }

  const recentSignal = signals.length > 0
      ? signals.filter(s => n - s.index <= 20).slice(-1)[0]
      : null;

  let action, actionCls, reason;
  if (recentSignal) {
    const daysAgo = n - recentSignal.index;
    const isPotential = !!recentSignal.potential;
    const isBuy = recentSignal.type === 'buy';
    const sigKind = currentStrategy === 'chan'
        ? `背驰 ${recentSignal.label}`
        : (isBuy ? '金叉' : '死叉');
    if (daysAgo === 0) {
      action = `今日出现${sigKind}${isPotential ? '（待确认）' : ''}`;
      actionCls = isPotential ? 'advice-hold' : (isBuy ? 'advice-buy' : 'advice-sell');
      if (currentStrategy === 'chan') {
        reason = isPotential
            ? (isBuy ? '今日 K 线低于昨日，可能正在形成底分型，明日 K 线高于今日才算确认'
                     : '今日 K 线高于昨日，可能正在形成顶分型，明日 K 线低于今日才算确认')
            : (isBuy ? chanBuyReason(recentSignal.label) : chanSellReason(recentSignal.label));
      } else {
        reason = `MA5 今日${isBuy ? '上穿' : '下穿'} MA20 (${m20.toFixed(2)})`;
      }
    } else {
      action = `${sigKind}后第 ${daysAgo} 天`;
      actionCls = isBuy ? (daysAgo <= 5 ? 'advice-buy' : 'advice-hold') : 'advice-wait';
      reason = `${recentSignal.date} 出现${sigKind}`;
    }
  } else {
    if (m5 > m10 && m10 > m20 && above20) {
      action = '多头排列'; actionCls = 'advice-buy';
    } else if (m5 < m10 && m10 < m20 && !above20) {
      action = '空头排列'; actionCls = 'advice-wait';
    } else {
      action = '均线纠缠'; actionCls = 'advice-hold';
    }
    reason = '近 20 日无新信号';
  }

  // 量能：今日单日量比 + 近期持续量能
  const vrT = volRatioToday(sorted, n), vrS = volRatioSustained(sorted, n);
  const lbT = volLabelToday(vrT), lbS = volLabelSustained(vrS);
  const volClr = { 爆量: '#b91c1c', 放量: '#c2410c', 平量: '#6b7280', 缩量: '#2563eb', 地量: '#7c3aed' };
  let volLine = '';
  if (vrT != null) {
    volLine = `<div><span class="label">量能:</span>`
      + `<b style="color:${volClr[lbT] || '#6b7280'}">${lbT} ${vrT.toFixed(2)}倍</b>`
      + `<span class="dim" style="margin-left:4px">（今日/前5日均量）</span>`;
    if (vrS != null && lbS && lbS !== '平量') {
      volLine += `　近期<b style="color:${volClr[lbS] || '#6b7280'}">${lbS} ${vrS.toFixed(2)}倍</b>`
        + `<span class="dim" style="margin-left:4px">（近5日/前5日均量）</span>`;
    }
    volLine += `</div>`;
  }

  let suspLine = '';
  const susp = distributionSuspicion(sorted);
  if (susp.score >= 30) {
    suspLine = `<div><span class="label">滞涨:</span>`
      + `<b style="color:#a16207">放量滞涨${susp.levelText} ${susp.score}</b>`
      + (susp.reason ? `<span class="dim" style="margin-left:6px">${susp.reason}</span>` : '')
      + `</div>`;
  }

  adviceEl.style.display = 'block';
  adviceEl.className = 'kline-advice ' + actionCls;
  adviceEl.innerHTML = `
    <div><span class="label">信号:</span><b>${action}</b>
         <span class="dim" style="margin-left:8px">${reason}</span></div>
    <div><span class="label">趋势:</span>${trend} ·
         当前价 <b>${close.toFixed(2)}</b>
         ${above20 ? '<span class="up">高于</span>' : '<span class="dn">低于</span>'}
         MA20 (${m20.toFixed(2)}) ${Math.abs(priceVs20).toFixed(1)}%</div>
    ${volLine}
    ${suspLine}
  `;
}

// ===== 自选分组 =====
let currentWatchGroup = null;
// ===== 自选分组 =====
let watchItems = [];      // 已加载（服务端分页累积）
let watchTotal = 0;
let watchLoading = false;
let watchSeq = 0;
let watchSeen = new Set();
let watchFetched = 0;
let watchScrollBound = false;
let watchKw = '';
let watchSearchTimer = null;
const WATCH_CHUNK = 30;   // 页大小（扫描弹窗等处也引用）

function watchStatus(msg, kind) {
  const el = document.getElementById('watch-status');
  el.textContent = msg || '';
  el.className = 'status ' + (kind || '');
}

function loadWatchGroups() {
  fetch('/api/watch/groups')
      .then(r => r.json())
      .then(data => {
        const sel = document.getElementById('watch-group-select');
        const groups = data.groups || [];
        sel.innerHTML = '';
        if (groups.length === 0) {
          sel.innerHTML = '<option value="">（暂无分组，点新建）</option>';
          currentWatchGroup = null;
          loadWatchGroup();
          return;
        }
        groups.forEach(g => {
          const opt = document.createElement('option');
          opt.value = g; opt.text = g;
          sel.appendChild(opt);
        });
        if (!currentWatchGroup || !groups.includes(currentWatchGroup)) {
          currentWatchGroup = groups[0];
        }
        sel.value = currentWatchGroup;
        loadWatchGroup();
      })
      .catch(e => watchStatus('加载分组失败: ' + e, 'error'));
}

function loadWatchGroup() {
  syncDelGroupBtn();
  watchItems = []; watchTotal = 0; watchSeen.clear(); watchFetched = 0;
  const mySeq = ++watchSeq;
  watchLoading = false;
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  const card = document.querySelector('#split-layout .col-left .card');
  if (card) card.scrollTop = 0;
  if (!currentWatchGroup) {
    tbody.innerHTML = `<tr><td colspan="${WATCH_COLS.length}" class="empty">${WATCH_EMPTY_MSG}</td></tr>`;
    document.getElementById('watch-count').textContent = '';
    return;
  }
  fetchWatchPage(true, mySeq);
  bindWatchScroll();
}

async function fetchWatchPage(first, seq) {
  if (seq == null) seq = watchSeq;
  if (seq !== watchSeq || watchLoading || !currentWatchGroup) return;
  watchLoading = true;
  try {
    const q = new URLSearchParams({ name: currentWatchGroup, offset: watchFetched, limit: WATCH_CHUNK });
    if (watchKw) q.set('kw', watchKw);
    const d = await (await fetch('/api/watch/group?' + q.toString())).json();
    if (seq !== watchSeq) { watchLoading = false; return; }
    watchFetched += (d.items || []).length;
    watchTotal = d.total || 0;
    const tbody = document.getElementById('rows');
    if (first) tbody.innerHTML = '';
    const startIdx = watchItems.length;
    (d.items || []).forEach(it => {
      if (it && it.code && !watchSeen.has(it.code)) { watchSeen.add(it.code); watchItems.push(it); }
    });
    if (first && !watchItems.length) {
      const msg = watchKw ? `没有匹配「${watchKw}」的股票` : WATCH_EMPTY_MSG;
      tbody.innerHTML = `<tr><td colspan="${WATCH_COLS.length}" class="empty">${msg}</td></tr>`;
    } else {
      let html = '';
      for (let i = startIdx; i < watchItems.length; i++) html += renderWatchRow(watchItems[i], i);
      tbody.insertAdjacentHTML('beforeend', html);
    }
    document.getElementById('watch-count').textContent =
        currentWatchGroup ? (watchKw ? `${watchTotal} 只匹配` : `${watchTotal} 只`) : '';
    updateWatchFooter();
  } catch (e) { watchStatus('加载分组内容失败: ' + e, 'error'); }
  watchLoading = false;
  fillWatchViewport();
}

function updateWatchFooter() {

  if (watchTotal <= WATCH_CHUNK) { pager.style.display = 'none'; return; }
  pager.style.display = 'flex';

      ? `— 已全部加载，共 ${watchTotal} 只 —`
      : `已加载 ${watchItems.length}/${watchTotal} 只 · 继续下滑加载更多`;
}

function bindWatchScroll() {
  if (watchScrollBound) return;
  const card = document.querySelector('#split-layout .col-left .card');
  if (!card) return;
  card.addEventListener('scroll', () => {
    if (currentTab !== 'watch' || watchLoading) return;
    if (watchFetched >= watchTotal) return;
    if (card.scrollTop + card.clientHeight >= card.scrollHeight - 120) fetchWatchPage(false, watchSeq);
  });
  watchScrollBound = true;
}

// 容器没填满（不可滚动）时继续拉下一页
function fillWatchViewport() {
  const card = document.querySelector('#split-layout .col-left .card');
  if (!card || !card.style.maxHeight) return;
  if (watchLoading || watchFetched >= watchTotal) return;
  if (card.scrollHeight <= card.clientHeight + 4) fetchWatchPage(false, watchSeq);
}

async function exportWatchCodes() {
  if (!currentWatchGroup) { alert('请先选择一个分组'); return; }
  watchStatus('正在获取完整清单…', 'info');
  let allItems = [];
  try { allItems = await fetchWholeGroup(currentWatchGroup); } catch (e) {}
  const codes = (allItems || [])
      .map(it => (it.code || '').trim())
      .filter(c => /^\d{6}$/.test(c));   // 只导 6 位数字代码
  if (!codes.length) { alert('当前分组没有可导出的 6 位代码'); return; }
  const rows = ['代码'].concat(codes.map(c => '="' + c + '"'));
  const csv = '﻿' + rows.join('\r\n');   // BOM 保证 Excel 中文/编码正常
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = currentWatchGroup + '_股票代码.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

function renderKline(bars) {
  const sorted = bars;
  const dates  = sorted.map(b => b.tradeDate);
  const ohlc  = sorted.map(b => [b.open, b.close, b.low, b.high]);
  const vols  = sorted.map((b, i) => [i, b.volume, b.close >= b.open ? 1 : -1]);

  // 算 MA
  const ma = (n) => sorted.map((_, i) => {
    if (i < n - 1) return null;
    let sum = 0;
    for (let j = 0; j < n; j++) sum += sorted[i - j].close;
    return +(sum / n).toFixed(2);
  });
  const ma5  = ma(5);
  const ma10 = ma(10);
  const ma20 = ma(20);

  // 买卖信号 + 建议
  const signals = computeSignals(sorted, ma5, ma20);
  updateAdvice(sorted, ma5, ma10, ma20, signals);

  const markData = signals.map(s => {
    const buyColor  = s.potential ? '#86efac' : '#16a34a';   // 潜在用浅绿
    const sellColor = s.potential ? '#fca5a5' : '#dc2626';   // 潜在用浅红
    const fillColor = s.type === 'buy' ? buyColor : sellColor;

      name: s.title,

      value: s.label,

        color: fillColor,

        borderWidth: 2,
        shadowBlur: 8,

      },
      symbol: 'pin',
      symbolSize: s.label.length >= 2 ? 56 : 48,
      symbolOffset: [0, s.type === 'buy' ? 4 : -4],   // 拉离 K 线一点
      symbolRotate: s.type === 'buy' ? 180 : 0,
      label: {
        color: '#fff',
        fontWeight: 'bold',
        fontSize: 14,
        offset: [0, s.type === 'buy' ? -8 : 8]
      },
      z: 100  // 强制最上层
    };
  });

  ensureKlineChart().setOption({
    animation: false,
    legend: { data: ['日K', 'MA5', 'MA10', 'MA20', '成交量'], top: 0, textStyle: { fontSize: 11 } },
    tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
    grid: [
      // K 线主图
      { left: 50, right: 20, top: 36, height: '58%' },
      { left: 50, right: 20, top: '70%', height: '22%' }

    xAxis: [
      { type: 'category', data: dates, scale: true, boundaryGap: false,
        axisLine: { onZero: false }, splitLine: { show: false },
        axisLabel: { fontSize: 10 } },
      { type: 'category', gridIndex: 1, data: dates, axisLabel: { show: false },
        axisTick: { show: false }, axisLine: { show: false } }
    ],
    yAxis: [
      { scale: true, splitArea: { show: false }, axisLabel: { fontSize: 10 } },
      { gridIndex: 1, splitNumber: 2, axisLabel: { show: false },
        axisLine: { show: false }, axisTick: { show: false }, splitLine: { show: false } }
    ],
    dataZoom: [
      { type: 'inside', xAxisIndex: [0, 1], start: 0, end: 100 },
      { show: true, type: 'slider', xAxisIndex: [0, 1], bottom: 4, height: 14, start: 0, end: 100 }
    ],
    series: [
      {
        name: '日K', type: 'candlestick', data: ohlc,
        itemStyle: { color: '#dc2626', color0: '#16a34a',
                     borderColor: '#dc2626', borderColor0: '#16a34a' },
        markPoint: { data: markData }
      },
      { name: 'MA5',  type: 'line', data: ma5,  smooth: true,
        lineStyle: { width: 1, color: '#f59e0b' }, symbol: 'none' },
      { name: 'MA10', type: 'line', data: ma10, smooth: true,
        lineStyle: { width: 1, color: '#2563eb' }, symbol: 'none' },
      { name: 'MA20', type: 'line', data: ma20, smooth: true,
        lineStyle: { width: 1, color: '#a855f7' }, symbol: 'none' },
      { name: '成交量', type: 'bar', xAxisIndex: 1, yAxisIndex: 1, data: vols.map(v => v[1]),
        itemStyle: { color: function(p) {
          const b = sorted[p.dataIndex];
          const base = b.close >= b.open ? '220,38,38' : '22,163,74';
          const r = volRatioToday(sorted, p.dataIndex);
          let op = 0.55;
          if (r != null) {

// ===== 指标扫描 =====

function maSeries(sorted, n) {
  return sorted.map((_, i) => {
    if (i < n - 1) return null;
    let s = 0;
    for (let j = 0; j < n; j++) s += sorted[i - j].close;
    return +(s / n).toFixed(2);
  });
}

function volRatioAtBar(sorted, j) {
  if (j < 5) return 1;
  let s = 0; for (let k = j - 5; k < j; k++) s += sorted[k].volume;
  const avg = s / 5;
  return avg > 0 ? sorted[j].volume / avg : 1;
}

function distributionSuspicion(bars) {
  const n = bars ? bars.length : 0;
  if (n < 21) return { score: 0, eff: 0, stall: 0, pos: 0, reason: '数据不足', level: 0, levelText: '低' };
  const i = n - 1, t = bars[i], prevClose = bars[i - 1].close;
  if (prevClose <= 0 || t.high <= t.low) return { score: 0, eff: 0, stall: 0, pos: 0, reason: '数据异常', level: 0, levelText: '低' };
  const chgPct = (t.close / prevClose - 1) * 100;
  const vr = volRatioAtBar(bars, i);
  const why = [];
  // ① 效率低下（40）
  let eff = 0;
  if (vr >= 1.2) {
    const efficiency = Math.abs(chgPct) / vr;
    const lack = Math.max(0, Math.min(1, (1.5 - efficiency) / 1.5));
    const volBoost = Math.min(1, (vr - 1.2) / 1.3);
    eff = Math.round(40 * lack * (0.5 + 0.5 * volBoost));
    if (eff >= 15) why.push(`量比${vr.toFixed(1)}倍仅涨${chgPct.toFixed(1)}%`);
  }
  // ② 滞涨长影（25）
  let stall = 0;
  if (vr >= 1.5) {
    const range = t.high - t.low;
    const upperShadow = t.high - Math.max(t.open, t.close);
    const shadowRatio = range > 0 ? upperShadow / range : 0;
    if (chgPct < 1.0) stall += 12;
    if (chgPct < 0) stall += 5;
    if (shadowRatio > 0.4) stall += Math.round(8 * Math.min(1, (shadowRatio - 0.4) / 0.4));
    stall = Math.min(25, stall);
    if (stall >= 10) why.push(shadowRatio > 0.4 ? `放量滞涨且上影占${(shadowRatio * 100).toFixed(0)}%` : '放量滞涨');
  }
  // ③ 位置偏高（20）
  let pos = 0;
  const from = Math.max(0, i - 59);
  let lo = Infinity, hi = -Infinity;
  for (let j = from; j <= i; j++) { lo = Math.min(lo, bars[j].low); hi = Math.max(hi, bars[j].high); }
  const posPct = hi > lo ? (t.close - lo) / (hi - lo) : 0.5;
  if (posPct > 0.5 && (eff > 0 || stall > 0)) {
    pos = Math.round(20 * Math.min(1, (posPct - 0.5) / 0.4));
    if (pos >= 8) why.push(`位置${(posPct * 100).toFixed(0)}分位偏高`);
  }
  let total = eff + stall + pos;
  // ④ 持续性折扣
  if (total > 0 && i >= 3) {
    let allUp = true, allVol = true;
    for (let j = i - 2; j <= i; j++) {
      if (bars[j].close <= bars[j - 1].close) allUp = false;
      if (volRatioAtBar(bars, j) < 1.2) allVol = false;
    }
    if (allUp && allVol) { total = Math.floor(total / 2); why.push('但连续放量上行(疑真实进攻，嫌疑减半)'); }
  }
  total = Math.max(0, Math.min(100, total));
  return {
    score: total, eff, stall, pos, reason: why.join('、'),
    level: total >= 60 ? 2 : total >= 30 ? 1 : 0,
    levelText: total >= 60 ? '明显' : total >= 30 ? '中等' : '不明显',
  };
}

function renderSuspHtml(susp) {
  if (!susp || susp.score < 30) return '';
  const row = (label, got, max, note) =>
    `<div style="font-size:12.5px;line-height:1.8;">· ${label} <b>${got}</b><span class="dim">/${max}</span>`
    + (note ? `　<span class="dim">${note}</span>` : '') + `</div>`;
  return `<div style="border-top:1px solid #eef1f4;margin-top:14px;padding-top:12px;">
    <div style="font-weight:700;font-size:13.5px;color:#a16207;">放量滞涨强度 ${susp.score}/100（${susp.levelText}）</div>
    ${susp.reason ? `<div style="font-size:12.5px;margin-top:4px;">${susp.reason}</div>` : ''}
    <div style="margin-top:6px;">
      ${row('效率低下', susp.eff, 40)}
      ${row('滞涨长影', susp.stall, 25)}
      ${row('位置偏高', susp.pos, 20)}
    </div>
  </div>`;
}

function detectBreakout(bars) {
  const n = bars ? bars.length : 0;
  if (n < 70) return null;
  const i = n - 1;
  const close = bars[i].close;
  const ma20 = maSeries(bars, 20), ma60 = maSeries(bars, 60);
  if (ma20[i] == null || close <= ma20[i]) return null;
  const ma60Now = ma60[i], ma60Prev = ma60[Math.max(0, i - 5)];
  const downTrend = ma60Now < ma60Prev * 0.995 && close < ma60Now;
  if (downTrend) return null;
  const hiFrom = Math.max(0, i - 3 - 60), hiTo = i - 3;
  if (hiTo > hiFrom) {
    let priorHigh = -Infinity;
    for (let j = hiFrom; j <= hiTo; j++) priorHigh = Math.max(priorHigh, bars[j].high);
    for (let j = Math.max(1, i - 2); j <= i; j++) {
      if (bars[j].close > priorHigh && bars[j - 1].close <= priorHigh && volRatioAtBar(bars, j) > 1.3) return '新高突破';
    }
  }
  const boxFrom = Math.max(0, i - 28), boxTo = i - 4;
  if (boxTo - boxFrom >= 12) {
    let boxHigh = -Infinity, boxLow = Infinity;
    for (let j = boxFrom; j <= boxTo; j++) { boxHigh = Math.max(boxHigh, bars[j].high); boxLow = Math.min(boxLow, bars[j].low); }
    const narrow = boxLow > 0 && (boxHigh - boxLow) / boxLow < 0.18;
    let brokeBox = false;
    for (let j = Math.max(1, i - 2); j <= i; j++) {
      if (bars[j].close > boxHigh && bars[j - 1].close <= boxHigh && volRatioAtBar(bars, j) > 1.3) { brokeBox = true; break; }
    }
    if (narrow && brokeBox) {
      const chan = computeChanSignals(bars);
      let cnt = 0, lastBuyLabel = null;
      for (const sg of chan) {
        if (sg.potential || sg.type !== 'buy') continue;
        if (i - sg.index > 15) continue;
        cnt++; lastBuyLabel = sg.label;
      }
      if (cnt >= 2 && (lastBuyLabel === 'B2' || lastBuyLabel === 'B3')) return '平台突破';
    }
  }
  return null;
}

function platformBreakoutDaysAgo(bars, maxBack) {
  const n = bars ? bars.length : 0;
  if (n < 70) return null;
  const ma20 = maSeries(bars, 20), ma60 = maSeries(bars, 60);
  const chan = computeChanSignals(bars);
  for (let d = 0; d <= maxBack; d++) {
    const j = n - 1 - d;
    if (j < 69) break;   // 突破日当天也要有 ≥70 根历史
    if (isPlatformBreakoutDayJs(bars, j, ma20, ma60, chan)) return d;
  }
  return null;
}
function isPlatformBreakoutDayJs(bars, j, ma20, ma60, chan) {
  if (j < 1) return false;
  const close = bars[j].close;
  if (ma20[j] == null || close <= ma20[j]) return false;
  const ma60Now = ma60[j], ma60Prev = ma60[Math.max(0, j - 5)];
  if (ma60Now != null && ma60Now < ma60Prev * 0.995 && close < ma60Now) return false;
  const boxFrom = Math.max(0, j - 28), boxTo = j - 4;
  if (boxTo - boxFrom < 12) return false;
  let boxHigh = -Infinity, boxLow = Infinity;
  for (let k = boxFrom; k <= boxTo; k++) { boxHigh = Math.max(boxHigh, bars[k].high); boxLow = Math.min(boxLow, bars[k].low); }
  if (!(boxLow > 0 && (boxHigh - boxLow) / boxLow < 0.18)) return false;
  if (!(close > boxHigh && bars[j - 1].close <= boxHigh && volRatioAtBar(bars, j) > 1.3)) return false;
  let cnt = 0, lastBuyLabel = null;
  for (const sg of chan) {
    if (sg.potential || sg.type !== 'buy') continue;
    if (sg.index > j || j - sg.index > 15) continue;
    cnt++; lastBuyLabel = sg.label;
  }
  return cnt >= 2 && (lastBuyLabel === 'B2' || lastBuyLabel === 'B3');
}

function scoreStock(bars, rps) {
  const sorted = bars || [];
  const n = sorted.length;
  if (n < 25) return { level: '数据不足', tier: 0, score: 0,
    reasons: [{ kind: 'warn', text: 'K 线数据不足 25 根，无法判断' }], facts: [{ c: 'DATA_SHORT' }] };

  const ma5 = maSeries(sorted, 5), ma10 = maSeries(sorted, 10), ma20 = maSeries(sorted, 20);
  const i = n - 1, bar = sorted[i];
  const close = bar.close, m5 = ma5[i], m10 = ma10[i], m20 = ma20[i];
  const bull = m5 > m10 && m10 > m20;
  const bear = m5 < m10 && m10 < m20;
  const aboveMA20 = m20 != null && close > m20;

  // 均线金叉死叉
  const maSig = computeMaSignals(sorted, ma5, ma20);
  const lastMa = maSig.length ? maSig[maSig.length - 1] : null;
  const lastMaBuy = [...maSig].reverse().find(s => s.type === 'buy');
  const goldenDaysAgo = lastMaBuy ? i - lastMaBuy.index : null;
  const deathMoreRecent = lastMa && lastMa.type === 'sell';

  // 背驰法（排除今日待确认的潜在信号）
  const chanSig = computeChanSignals(sorted).filter(s => !s.potential);
  const lastChan = chanSig.length ? chanSig[chanSig.length - 1] : null;
  const lastChanBuy = [...chanSig].reverse().find(s => s.type === 'buy');
  const chanBuyDaysAgo = lastChanBuy ? i - lastChanBuy.index : null;
  const chanSellMoreRecent = lastChan && lastChan.type === 'sell';
  const CHAN_BC_WIN = 15;
  const chanBuyCount = chanSig.filter(s => s.type === 'buy' && (i - s.index) < CHAN_BC_WIN).length;
  const _vrT = volRatioToday(sorted, i), _vrS = volRatioSustained(sorted, i);
  const vRatioScan = _vrT != null ? +_vrT.toFixed(2) : null;
  const vRatio5Scan = _vrS != null ? +_vrS.toFixed(2) : null;

  // 量能：今日相对前 5 日均量
  let volAvg5 = null;
  if (i >= 5) { let s = 0; for (let j = 1; j <= 5; j++) s += sorted[i - j].volume; volAvg5 = s / 5; }
  const todayUp = close >= bar.open;
  const volRatio = volAvg5 ? bar.volume / volAvg5 : null;
  const volExpand = volRatio != null && volRatio >= 1.3;

  // 位置：近 60 日（或全部）相对高低
  const win = Math.min(60, n);
  let hi = -Infinity, lo = Infinity;
  for (let j = n - win; j < n; j++) { if (sorted[j].high > hi) hi = sorted[j].high; if (sorted[j].low < lo) lo = sorted[j].low; }
  const posRatio = hi > lo ? (close - lo) / (hi - lo) : 0.5;
  const posPct = Math.round(posRatio * 100);
  const lowPos = posRatio <= 0.35, highPos = posRatio >= 0.7;

  const reasons = [];
  const facts = [];

  if (bear && !aboveMA20) {
    reasons.push({ kind: 'bad', text: `空头排列，且收盘价在 MA20(${m20}) 下方 — 下跌趋势` });
    facts.push({ c: 'VETO_BEAR_BELOW_MA20', m20 });
    if (lastChanBuy && chanBuyDaysAgo <= 10) {
      reasons.push({ kind: 'warn', text: `虽 ${chanBuyDaysAgo} 天前有背驰${lastChanBuy.label}，但均线仍是空头排列` });
      facts.push({ c: 'VETO_RECENT_BUY', days: chanBuyDaysAgo, label: lastChanBuy.label });
    }
    reasons.push({ kind: 'neutral', text: `位置：近 ${win} 日 ${posPct}%` });
    facts.push({ c: 'POS', win, pct: posPct });
    return { level: 'E档', tier: 1, score: 8, reasons, facts,
      bLabel: lastChanBuy ? lastChanBuy.label : null, bDaysAgo: chanBuyDaysAgo, bCount: chanBuyCount,
      vRatio: vRatioScan, vRatio5: vRatio5Scan };
  }

  let score = 0;
  // 趋势排列
  if (bull) { score += 25; reasons.push({ kind: 'good', text: `多头排列 MA5>MA10>MA20（${m5}/${m10}/${m20}）` }); facts.push({ c: 'MA_BULL', m5, m10, m20 }); }
  else if (m5 > m20) { score += 12; reasons.push({ kind: 'good', text: `MA5 在 MA20 上方，趋势偏多` }); facts.push({ c: 'MA5_ABOVE_MA20' }); }
  else if (bear) { score -= 15; reasons.push({ kind: 'warn', text: `空头排列，趋势偏弱` }); facts.push({ c: 'MA_BEAR' }); }
  // MA20 位置
  if (aboveMA20) { score += 10; reasons.push({ kind: 'good', text: `收盘 ${close} 站上 MA20(${m20})` }); facts.push({ c: 'ABOVE_MA20', close, m20 }); }
  else { reasons.push({ kind: 'warn', text: `收盘 ${close} 仍在 MA20(${m20}) 下方` }); facts.push({ c: 'BELOW_MA20', close, m20 }); }
  // 金叉
  if (goldenDaysAgo != null && goldenDaysAgo <= 10) { score += 20; reasons.push({ kind: 'good', text: `${goldenDaysAgo} 天前 MA5 金叉 MA20，趋势转多` }); facts.push({ c: 'GOLDEN_RECENT', days: goldenDaysAgo }); }
  else if (goldenDaysAgo != null && goldenDaysAgo <= 30) { score += 6; reasons.push({ kind: 'good', text: `${goldenDaysAgo} 天前金叉，趋势已确立` }); facts.push({ c: 'GOLDEN_OLD', days: goldenDaysAgo }); }
  if (deathMoreRecent) { score -= 20; reasons.push({ kind: 'bad', text: `最近一次均线信号是死叉，趋势走弱` }); facts.push({ c: 'DEATH_RECENT' }); }
  // 背驰买点
  if (lastChanBuy && chanBuyDaysAgo <= 10) {
    const pts = lastChanBuy.label === 'B3' ? 25 : lastChanBuy.label === 'B2' ? 20 : 8;
    const desc = lastChanBuy.label === 'B3' ? '三买（突破回踩不破）'
               : lastChanBuy.label === 'B2' ? '二买（不破前低）'
               : '一买（底部分型）';
    score += pts;
    reasons.push({ kind: lastChanBuy.label === 'B1' ? 'warn' : 'good', text: `${chanBuyDaysAgo} 天前背驰${desc}` });
    facts.push({ c: 'CHAN_BUY_RECENT', days: chanBuyDaysAgo, label: lastChanBuy.label });
  } else if (lastChanBuy && chanBuyDaysAgo <= 20) {
    score += 4; reasons.push({ kind: 'good', text: `${chanBuyDaysAgo} 天前背驰${lastChanBuy.label}（稍远）` });
    facts.push({ c: 'CHAN_BUY_OLD', days: chanBuyDaysAgo, label: lastChanBuy.label });
  }
  if (chanSellMoreRecent) { score -= 18; reasons.push({ kind: 'bad', text: `最近的背驰信号是 ${lastChan.label}` }); facts.push({ c: 'CHAN_SELL_RECENT', label: lastChan.label }); }
  if (volExpand && todayUp) { score += 5; reasons.push({ kind: 'good', text: `放量上涨（量比 ${volRatio.toFixed(1)}× 近 5 日均量）` }); facts.push({ c: 'VOL_UP', ratio: +volRatio.toFixed(1) }); }
  else if (volRatio != null && volRatio < 0.7) { score -= 3; reasons.push({ kind: 'warn', text: `缩量（量比 ${volRatio.toFixed(1)}×）` }); facts.push({ c: 'VOL_SHRINK', ratio: +volRatio.toFixed(1) }); }
  const _bk = detectBreakout(sorted);
  let _bkDays = null;
  try { _bkDays = platformBreakoutDaysAgo(sorted, 15); } catch (e) { /* 不影响打分 */ }
  if (_bk === '平台突破') { score += 12; reasons.push({ kind: 'good', text: '★ 平台突破' }); facts.push({ c: 'BK_PLATFORM' }); }
  else if (_bk === '新高突破') { score += 6; reasons.push({ kind: 'good', text: '新高突破（放量创 60 日新高）' }); facts.push({ c: 'BK_NEWHIGH' }); }
  // 位置
  if (lowPos) { score += 15; reasons.push({ kind: 'good', text: `处于近 ${win} 日低位（${posPct}%）` }); facts.push({ c: 'POS_LOW', win, pct: posPct }); }
  else if (highPos) { score -= 10; reasons.push({ kind: 'warn', text: `处于近 ${win} 日高位（${posPct}%）` }); facts.push({ c: 'POS_HIGH', win, pct: posPct }); }
  else { reasons.push({ kind: 'neutral', text: `位置中位（${posPct}%）` }); facts.push({ c: 'POS_MID', win, pct: posPct }); }

  // 三重共振加亮
  const confluence = lastChanBuy && chanBuyDaysAgo <= 10
      && (lastChanBuy.label === 'B2' || lastChanBuy.label === 'B3')
      && goldenDaysAgo != null && goldenDaysAgo <= 10 && bull;
  if (confluence) { score += 8; reasons.unshift({ kind: 'good', text: '★ 背驰买点 + 均线金叉 + 多头排列 三重共振' }); facts.unshift({ c: 'CONFLUENCE' }); }

  const chand = chandelierAt(sorted, i);
  if (chand != null) {
    if (close > chand) { score += 5; reasons.push({ kind: 'good', text: `收盘在 ATR 吊灯线(${chand.toFixed(2)}) 上方` }); facts.push({ c: 'CHAND_ABOVE', v: +chand.toFixed(2) }); }
    else { score -= 10; reasons.push({ kind: 'bad', text: `收盘跌破 ATR 吊灯线(${chand.toFixed(2)})` }); facts.push({ c: 'CHAND_BELOW', v: +chand.toFixed(2) }); }
  }
  const rps120 = rps && rps.rps120 != null ? Number(rps.rps120) : null;
  if (rps120 != null) {
    if (rps120 >= 85) { score += 10; reasons.push({ kind: 'good', text: `RPS120=${rps120.toFixed(0)}，市场最强 15%` }); facts.push({ c: 'RPS_TOP', v: Math.round(rps120) }); }
    else if (rps120 >= 70) { score += 5; reasons.push({ kind: 'good', text: `RPS120=${rps120.toFixed(0)}，强于市场多数` }); facts.push({ c: 'RPS_STRONG', v: Math.round(rps120) }); }
    else if (rps120 < 50) { score -= 5; reasons.push({ kind: 'warn', text: `RPS120=${rps120.toFixed(0)}，弱于市场中位数` }); facts.push({ c: 'RPS_WEAK', v: Math.round(rps120) }); }
    else { reasons.push({ kind: 'neutral', text: `RPS120=${rps120.toFixed(0)}，市场中游` }); facts.push({ c: 'RPS_MID', v: Math.round(rps120) }); }
  }
  try {
    const _ex = expertAdvice(sorted);
    if (_ex && _ex.ok && _ex.overext) {
      score -= 8;
      reasons.push({ kind: 'bad', text: '短线透支' });
      facts.push({ c: 'OVEREXT' });
    }
  } catch (e) { /* 判别失败不影响打分 */ }

  score = Math.max(0, Math.min(100, Math.round(score)));
  let level, tier;
  if (score >= 70) { level = 'A档'; tier = 5; }
  else if (score >= 50) { level = 'B档'; tier = 4; }
  else if (score >= 32) { level = 'C档'; tier = 3; }
  else { level = 'D档'; tier = 2; }
  const _susp = distributionSuspicion(sorted);
  return { level, tier, score, reasons, facts,
    bLabel: lastChanBuy ? lastChanBuy.label : null, bDaysAgo: chanBuyDaysAgo, bCount: chanBuyCount,
    vRatio: vRatioScan, vRatio5: vRatio5Scan, susp: _susp.score, suspReason: _susp.reason, _susp: _susp,
    pattern: _bk, bkDays: _bkDays };
}

// ===== 指标复盘 =====
const EXPERT_CFG = {
  biasTh: 0.07,     // 乖离率透支阈值（6%~8% 取中）
  streakTh: 5,      // 连涨天数透支阈值
  gainTh: 0.15,     // 近5日涨幅透支阈值
  likelyTh: 65,
  bounceTh: 40,
};

function emaSeries(vals, n) {
  const k = 2 / (n + 1), out = new Array(vals.length);
  let prev = null;
  for (let i = 0; i < vals.length; i++) {
    prev = prev == null ? vals[i] : vals[i] * k + prev * (1 - k);
    out[i] = prev;
  }
  return out;
}

function macdSeries(closes) {
  const e12 = emaSeries(closes, 12), e26 = emaSeries(closes, 26);
  const dif = closes.map((c, i) => e12[i] - e26[i]);
  const dea = emaSeries(dif, 9);
  const hist = dif.map((v, i) => 2 * (v - dea[i]));
  return { dif, dea, hist };
}

function linSlope(arr) {   // 简单线性回归斜率
  const n = arr.length; if (n < 2) return 0;
  let sx = 0, sy = 0, sxy = 0, sxx = 0;
  for (let i = 0; i < n; i++) { sx += i; sy += arr[i]; sxy += i * arr[i]; sxx += i * i; }
  const d = n * sxx - sx * sx;
  return d ? (n * sxy - sx * sy) / d : 0;
}

function findPivots(seg, wing) {
  const lows = [], highs = [];
  for (let i = wing; i < seg.length - wing; i++) {
    let isL = true, isH = true;
    for (let j = i - wing; j <= i + wing; j++) {
      if (seg[j].low < seg[i].low) isL = false;
      if (seg[j].high > seg[i].high) isH = false;
    }
    if (isL) lows.push(i);
    if (isH) highs.push(i);
  }
  return { lows, highs };
}

function expertAdvice(bars, opts) {
  opts = opts || {};
  const n = (bars || []).length;
  if (n < 70) return { ok: false, msg: 'K 线不足 70 根，形态判别需更长历史（先「刷新自选K线」预热 130 日）' };

  const closes = bars.map(b => b.close);
  const ma5s = maSeries(bars, 5), ma10s = maSeries(bars, 10),
        ma20s = maSeries(bars, 20), ma60s = maSeries(bars, 60);
  const i = n - 1, bar = bars[i], close = bar.close;
  const ma5 = ma5s[i], ma10 = ma10s[i], ma20 = ma20s[i], ma60 = ma60s[i];
  const { dif, hist } = macdSeries(closes);
  const reasons = [];

  // ---- §1 衍生指标 ----
  const biasMa5 = (close - ma5) / ma5;
  let volSum = 0; for (let j = i - 4; j <= i; j++) volSum += bars[j].volume;
  const volMa5 = volSum / 5;
  const volRatio = volMa5 > 0 ? bar.volume / volMa5 : 1;
  const volSlope = volMa5 > 0 ? linSlope(bars.slice(i - 4).map(b => b.volume)) / volMa5 : 0;
  let upStreak = 0; for (let j = i; j > 0 && bars[j].close >= bars[j - 1].close; j--) upStreak++;
  const gain5 = (close - bars[i - 5].close) / bars[i - 5].close;
  const maBull = ma5 > ma10 && ma10 > ma20 && ma20 > ma60;
  const maBear = ma5 < ma10 && ma10 < ma20 && ma20 < ma60;
  const maConverging = Math.abs(ma5 - ma60) < Math.abs(ma5s[i - 10] - ma60s[i - 10]) * 0.7;
  const ma60Slope = linSlope(ma60s.slice(i - 9));
  const ma5Up = ma5s[i] > ma5s[i - 3];

  const win = Math.min(60, n - 1);
  const seg = bars.slice(n - win);
  const piv = findPivots(seg, 3);
  const swingLow = piv.lows.length
      ? Math.min(...piv.lows.map(x => seg[x].low))
      : Math.min(...seg.map(b => b.low));
  let swingHigh = null;
  for (let k = piv.highs.length - 1; k >= 0; k--) {
    if (piv.highs[k] < win - 5) { swingHigh = seg[piv.highs[k]].high; break; }
  }
  if (swingHigh == null) swingHigh = Math.max(...seg.slice(0, Math.max(1, win - 5)).map(b => b.high));

  let downDays = 0;
  for (let j = Math.max(60, i - 40); j < i - 5; j++) {
    if (bars[j].close < ma60s[j] || (ma5s[j] < ma20s[j] && ma20s[j] < ma60s[j])) downDays++;
  }
  const wasDown = downDays >= 15;
  const recent10Low = Math.min(...bars.slice(i - 9).map(b => b.low));
  let higherLows = false;
  if (piv.lows.length >= 2) {
    higherLows = seg[piv.lows[piv.lows.length - 1]].low > seg[piv.lows[piv.lows.length - 2]].low;
  }
  let notLowerHighs = true;
  if (piv.highs.length >= 2) {
    notLowerHighs = seg[piv.highs[piv.highs.length - 1]].high >= seg[piv.highs[piv.highs.length - 2]].high * 0.98;
  }
  const rangeUp = ma60Slope > 0 && close > ma60 && higherLows && notLowerHighs;

  let regime;
  if (maBull && ma60Slope > 0 && close > ma60) regime = 'UPTREND';
  else if (maBear && ma60Slope < 0 && close < ma60) regime = 'DOWNTREND';
  else if (wasDown && close > ma5 && close > ma10 && close > swingLow * 1.03) regime = 'REBOUND';
  else if (wasDown && recent10Low > swingLow * 0.995 && Math.abs(ma5s[i] - ma5s[i - 5]) / close < 0.01) regime = 'BOTTOMING';
  else if (!wasDown && close > ma60 && close < ma5 && volRatio > 1.5) regime = 'TOPPING';
  else if (rangeUp) regime = 'RANGE_UP';
  else regime = 'RANGE';
  const regimeLabel = { UPTREND: '上升趋势', RANGE_UP: '震荡上升', DOWNTREND: '下降趋势',
                        BOTTOMING: '筑底中', REBOUND: '反弹中', TOPPING: '疑似见顶', RANGE: '震荡' }[regime];

  // ---- §3 反转概率分 ----
  // A 均线修复 30
  let a = 0;
  if (close > ma5) a += 0.15;
  if (close > ma20) a += 0.30;
  if (close > ma60) a += 0.25;
  if (ma5 > ma10 && ma5Up) a += 0.15;
  if (maConverging) a += 0.15;
  const scoreMa = Math.min(1, a);
  // B 量能质量 25
  let b = 0;
  if (volSlope > 0) b += 0.4;
  const brokeToday = (close > ma20 && bars[i - 1].close <= ma20s[i - 1])
      || (close > ma60 && bars[i - 1].close <= ma60s[i - 1])
      || (close > swingHigh && bars[i - 1].close <= swingHigh);
  if (brokeToday && volRatio > 1.5) b += 0.4;
  if (volRatio >= 1.0 && volRatio <= 2.0) b += 0.2;
  if (close > bars[i - 1].close && volRatio < 0.8) b -= 0.4;
  const scoreVol = Math.max(0, Math.min(1, b));
  let scoreBackchi = 0.3, backchiNote = '无明显二次探底结构，背驰维度按中性 0.3 计';
  const lowIdxAbs = piv.lows.map(x => x + n - win);
  if (lowIdxAbs.length >= 2) {
    const i1 = lowIdxAbs[lowIdxAbs.length - 2], i2 = lowIdxAbs[lowIdxAbs.length - 1];
    if (i2 - i1 >= 5 && bars[i2].low <= bars[i1].low * 1.02) {
      const negArea = c => {
        let s = 0;
        for (let j = Math.max(0, c - 4); j <= Math.min(i, c + 4); j++) if (hist[j] < 0) s += -hist[j];
        return s;
      };
      if (bars[i2].low <= bars[i1].low && (negArea(i2) < negArea(i1) * 0.8 || dif[i2] > dif[i1])) {
        scoreBackchi = 1.0; backchiNote = '二次探底 + MACD 底背驰成立（绿柱面积收缩/DIF抬高，一买雏形）';
      } else {
        scoreBackchi = 0.0; backchiNote = '二次探底但动能未衰竭（无背驰），更像下跌中继';
      }
    }
  }
  // D 突破确认 20
  let d = 0, breakoutLevel = null;
  let brokeIdx = -1;
  for (let j = Math.max(1, i - 9); j <= i; j++) {
    if (bars[j].close > swingHigh && bars[j - 1].close <= swingHigh) { brokeIdx = j; break; }
  }
  if (brokeIdx >= 0) {
    d += 0.5; breakoutLevel = swingHigh;
    if (brokeIdx < i) {
      let minLow = Infinity;
      for (let j = brokeIdx + 1; j <= i; j++) minLow = Math.min(minLow, bars[j].low);
      if (minLow >= Math.min(swingHigh, ma10) * 0.99 && close > bars[i - 1].close) d += 0.5;
    }
  }
  try {
    const chanSig = computeChanSignals(bars).filter(s => !s.potential);
    const lastB3 = [...chanSig].reverse().find(s => s.type === 'buy' && s.label === 'B3');
    if (lastB3 && i - lastB3.index <= 10) d = Math.max(d, 1);
  } catch (e) { /* 背驰信号不可用不影响其余维度 */ }
  const scoreBreakout = Math.min(1, d);

  const score = Math.round(30 * scoreMa + 25 * scoreVol + 25 * scoreBackchi + 20 * scoreBreakout);
  const verdict = score >= EXPERT_CFG.likelyTh ? 'REVERSAL_LIKELY'
                : score >= EXPERT_CFG.bounceTh ? 'UNCONFIRMED' : 'BOUNCE_ONLY';

  // ---- §4 透支（与反转分独立）----
  const overext = biasMa5 > EXPERT_CFG.biasTh
      || (upStreak >= EXPERT_CFG.streakTh && gain5 > EXPERT_CFG.gainTh);

  // ---- §5 关键价位 ----
  const recentHigh = Math.max(...seg.map(bb => bb.high));
  const aboveCands = [ma20, ma60, swingHigh, recentHigh].filter(v => v != null && v > close);
  const R1 = aboveCands.length ? Math.min(...aboveCands) : null;
  const belowCands = [ma10, ma20].filter(v => v != null && v <= close);
  const S1 = belowCands.length ? Math.max(...belowCands) : ma10;
  const hardStop = swingLow;
  const b3base = breakoutLevel != null ? breakoutLevel : S1;
  const buy3Zone = [Math.min(b3base, ma10), Math.max(b3base, ma10)];
  const sellZone = R1 == null ? null : [R1, Math.max(R1, recentHigh)];

  // ---- reasons ----
  reasons.push({ kind: 'neutral', text: `趋势状态：${regimeLabel}（MA60 ${ma60Slope > 0 ? '上行' : '下行/走平'}）` });
  reasons.push({ kind: scoreMa >= 0.6 ? 'good' : scoreMa >= 0.3 ? 'neutral' : 'warn',
    text: `均线修复 ${(scoreMa * 30).toFixed(0)}/30：${close > ma20 ? '已破MA20' : '未破MA20'}${close > ma60 ? '、收复MA60' : ''}${maConverging ? '、空头收敛' : ''}` });
  reasons.push({ kind: scoreVol >= 0.6 ? 'good' : scoreVol >= 0.3 ? 'neutral' : 'warn',
    text: `量能质量 ${(scoreVol * 25).toFixed(0)}/25：量比 ${volRatio.toFixed(1)}×${volSlope > 0 ? '，逐级放量' : ''}${(close > bars[i - 1].close && volRatio < 0.8) ? '，缩量上涨（虚）' : ''}` });
  reasons.push({ kind: scoreBackchi >= 1 ? 'good' : scoreBackchi > 0 ? 'neutral' : 'bad',
    text: `底背驰 ${(scoreBackchi * 25).toFixed(0)}/25：${backchiNote}` });
  const bkTxt = brokeIdx >= 0 ? `已突破前高 ${swingHigh.toFixed(2)}`
      : close > swingHigh ? `早已站上前高 ${swingHigh.toFixed(2)}（持续新高中）`
      : `前高压力 ${swingHigh.toFixed(2)} 未破`;
  reasons.push({ kind: scoreBreakout >= 0.5 ? 'good' : 'neutral',
    text: `突破确认 ${(scoreBreakout * 20).toFixed(0)}/20：${bkTxt}${scoreBreakout >= 1 ? '，回踩不破（三买成立）' : ''}` });
  if (overext) {
    reasons.push({ kind: 'warn',
      text: `短线透支：乖离MA5 ${(biasMa5 * 100).toFixed(1)}%${upStreak >= EXPERT_CFG.streakTh ? `、连涨${upStreak}天` : ''}${gain5 > EXPERT_CFG.gainTh ? `、5日涨${(gain5 * 100).toFixed(0)}%` : ''}` });
  }

  // ---- 大盘 override ----
  let marketDowngrade = false;
  const mkt = opts.market;
  if (mkt && (mkt.forcedDefensive || mkt.temperature < 32)) {
    marketDowngrade = true;
    reasons.unshift({ kind: 'warn',
      text: `大盘温度 ${Math.round(mkt.temperature)}${mkt.forcedDefensive ? '（风控强制防守）' : ''}，个股形态判别降一档` });
  }

  const chand = chandelierAt(bars, i);
  return { ok: true, regime, regimeLabel, score, verdict, overext, marketDowngrade,
    levels: { R1, S1, hardStop, buy3Zone, sellZone, chand },
    subs: { ma: scoreMa, vol: scoreVol, backchi: scoreBackchi, breakout: scoreBreakout },
    ctx: { close, ma10, ma20, ma60, volRatio, biasMa5, upStreak, gain5 },
    reasons };
}

function buildStructureNotes(adv) {
  const S = [];
  if (!adv.ok) return S;
  const { R1, S1, hardStop, buy3Zone } = adv.levels;
  const c = adv.ctx.close;
  const f = v => v == null ? '-' : Number(v).toFixed(2);
  const r1s = R1 == null ? '前高（当前创新高，无近期压力）' : f(R1);
  const nearR1 = R1 != null && c >= R1 * 0.97;
  const buy3Ok = adv.subs.breakout >= 1;

  if (adv.regime === 'DOWNTREND') {
    S.push({ cls: 'bad', text: `下降趋势未止；上方压力 ${r1s}，前低 ${f(hardStop)}` });
    return S;
  }
  S.push({ cls: 'neutral', text: `支撑 S1 ${f(S1)}（MA10/MA20），前低 ${f(hardStop)}` });
  if (adv.overext && nearR1) {
    S.push({ cls: 'warn', text: `短线透支，且价格接近压力 ${r1s}` });
  }
  if (buy3Ok) {
    S.push({ cls: 'good', text: `突破后回踩不破（三买结构成立），回踩确认区 ${f(buy3Zone[0])}~${f(buy3Zone[1])}` });
  } else if (adv.verdict === 'REVERSAL_LIKELY' && !adv.overext) {
    S.push({ cls: 'good', text: `反转形态得分 ${adv.score}，未透支；三买结构尚未确认` });
  }
  if (adv.verdict === 'BOUNCE_ONLY') {
    S.push({ cls: 'neutral', text: `判为纯反弹（${adv.score}分 < ${EXPERT_CFG.bounceTh}）` });
  }
  if (adv.verdict === 'UNCONFIRMED' && !buy3Ok && !adv.overext) {
    S.push({ cls: 'neutral', text: `方向未确认（${adv.score}分）；上方压力 ${r1s}，下方支撑 ${f(S1)}` });
  }
  if (adv.marketDowngrade) {
    S.push({ cls: 'warn', text: '大盘温度偏低' });
  }
  return S;
}

function renderWatchCard(adv) {
  const L = adv.levels, c = adv.ctx.close;
  const f = v => v == null ? '—' : Number(v).toFixed(2);
  const dist = t => {
    if (t == null) return '';
    const d = (t - c) / c * 100;
    if (Math.abs(d) < 0.3) return '≈现价';
    return d > 0 ? `高于现价 ${d.toFixed(1)}%` : `低于现价 ${(-d).toFixed(1)}%`;
  };
  const bz = L.buy3Zone;
  const buyNear = bz ? Math.max(bz[0], bz[1]) : L.S1;
  const sz = L.sellZone;
  const row = (label, color, main) => `
    <div style="display:flex;gap:8px;align-items:baseline;padding:6px 0;border-top:1px dashed #dbeafe;">
      <span style="flex:0 0 58px;font-weight:700;color:${color};">${label}</span>
      <span style="flex:1;line-height:1.6;">${main}</span>
    </div>`;
  const buyMain = `<b>${bz ? f(bz[0]) + '~' + f(bz[1]) : f(L.S1)}</b>（回踩确认区／支撑 S1 ${f(L.S1)}）`
    + `<span class="dim" style="font-size:11.5px;">　${dist(buyNear)}</span>`;
  const stopMain = `支撑 S1 <b>${f(L.S1)}</b> · ATR吊灯线 <b style="color:#ea580c">${f(L.chand)}</b> · 前低 <b style="color:#b91c1c">${f(L.hardStop)}</b>`;
  const trimMain = L.R1 == null
    ? '创新高，上方无近期压力'
    : `<b style="color:#c2410c">${sz && (sz[1] - sz[0]) >= sz[0] * 0.005 ? f(sz[0]) + '~' + f(sz[1]) : f(L.R1) + ' 附近'}</b>（压力 R1）`
      + `<span class="dim" style="font-size:11.5px;">　${dist(L.R1)}</span>`;
  return `
    <div style="border:1px solid #bfdbfe;background:#eff6ff;border-radius:8px;padding:9px 12px;margin-bottom:10px;">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px;">
        <span style="font-weight:700;">关键价位</span>
        <span class="dim" style="font-size:12px;">基准 最新收盘 <b style="color:#111827">${f(c)}</b></span>
      </div>
      ${row('支撑区', '#15803d', buyMain)}
      ${row('防守线', '#b91c1c', stopMain)}
      ${row('压力区', '#c2410c', trimMain)}
    </div>`;
}

function renderExpertHtml(adv) {

  const vMap = { REVERSAL_LIKELY: ['反转概率大', '#15803d', '#dcfce7'],
                 UNCONFIRMED: ['方向未确认', '#ca8a04', '#fef9c3'],

function renderStructureNotes(adv) {
