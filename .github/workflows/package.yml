name: 打包安装包

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  APP_NAME: 指标复盘盒子

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            kind: windows
          - os: macos-latest
            kind: mac
            arch: arm64
          - os: macos-15-intel
            kind: mac
            arch: intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 读取版本号
        run: echo "APP_VERSION=$(tr -d '[:space:]' < packaging/VERSION)" >> "$GITHUB_ENV"

      - name: 构建 jar
        run: |
          mvn -B -q package -DskipTests
          mkdir -p build/input dist
          cp target/a-sm-box-*.jar build/input/a-sm-box.jar

      - name: 准备 WiX（Windows）
        if: matrix.kind == 'windows'
        run: |
          if [ -n "$WIX" ] && [ -f "$WIX/bin/candle.exe" ]; then
            echo "$WIX\\bin" >> "$GITHUB_PATH"
          elif ! command -v candle.exe >/dev/null 2>&1; then
            choco install wixtoolset -y --no-progress
            echo "C:\\Program Files (x86)\\WiX Toolset v3.14\\bin" >> "$GITHUB_PATH"
          fi

      - name: 打包（Windows）
        if: matrix.kind == 'windows'
        run: |
          pack() {
            jpackage --type exe --name "$1" --app-version "$APP_VERSION" --vendor kildee \
              --input build/input --main-jar a-sm-box.jar \
              --icon packaging/icon.ico \
              --java-options "-Dsmbox.desktop=true" --java-options "-Dfile.encoding=UTF-8" --java-options "-Xmx512m" \
              --win-menu --win-shortcut --win-per-user-install --win-dir-chooser \
              --win-upgrade-uuid 6b0f6a52-3c0e-4d55-9a7e-2f1d5c8b7a10 \
              --dest dist
          }
          if pack "$APP_NAME"; then
            echo "used name: $APP_NAME"
          else
            echo "::warning::中文应用名打包失败，改用 SmBox 作为内部名称"
            rm -rf dist && mkdir -p dist
            pack "SmBox"
          fi
          ls -la dist
          mv dist/*.exe "dist/SmBox-Setup.exe"

      - name: 打包（macOS）
        if: matrix.kind == 'mac'
        env:
          LC_ALL: en_US.UTF-8
        run: |
          jpackage --type dmg --name "$APP_NAME" --app-version "$APP_VERSION" --vendor kildee \
            --input build/input --main-jar a-sm-box.jar \
            --icon packaging/icon.icns \
            --mac-package-identifier com.smbox.app \
            --java-options "-Dsmbox.desktop=true" --java-options "-Dfile.encoding=UTF-8" --java-options "-Xmx512m" \
            --java-options "-Dapple.awt.UIElement=true" \
            --dest dist
          ls -la dist
          mv dist/*.dmg "dist/SmBox-mac-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.kind }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(tr -d '[:space:]' < packaging/VERSION)"
          ls -la dist
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y
            sleep 5
          fi
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "指标复盘盒子 $tag" --notes "安装包见下方附件，使用方法见仓库首页的「快速开始」。"
